let fgQAt=0, fgIdleT=null, fgRaf=null, fgBeatAt=0, fgPending=null;   // 3차 ②: fgPrevSpinning 은 상태 판정으로 바뀌며 없어졌다

function fgEl(){ try{ return document.getElementById('forge'); }catch(e){ return null; } }
/* 대기열 띠의 점 — 대기 장비 하나당 등급색 점 하나. **빈 칸도 점으로 자리를
   지킨다**(띠 높이가 틱마다 안 변하게 · 검사 L3). 가려진 동안 보류분은 안 보인다.
   `fresh` 는 마무리 순간 새 점 하나가 한 번 반짝이는 것(§2⑤-7 — 날아가는 카드는 R2). */
/* ══ 047 3차 ⑤ — 점은 **띠 안에 다 들어간다** ════════════════════════════
   2차까지는 점 줄이 `overflow:hidden` 이라 좁은 칸에서 **조용히 잘렸다**
   (검증 F 실측: 800×450 ko 승천0 14/14 에서 점 11개만 보임 · en 12 · 360×640 13).
   「대기 장비 하나당 점 하나」가 거짓이 되는데 화면에는 아무 표시도 없다.

   고치는 법 둘: ⑴ 칸에 맞춰 **점을 줄인다**(7px → 최소 4px, 간격도 같이).
   ⑵ 4px 로도 안 들어가면 **마지막 자리를 「+N」**으로 바꾼다. 어느 쪽이든
   **보이는 점 수 + N = 실제 대기 수**가 늘 성립한다 — 잘려 사라지는 점은 없다. */
const QDOT_MAX=7, QDOT_MIN=4, QDOT_GAP_MAX=3, QDOT_GAP_MIN=2;
/* 047 4차 — 「+N」 글자 폭을 **먼저** 잰다 ═══════════════════════════════
   3차는 자리 수를 「모두 점」이라고 보고 센 뒤 **마지막 한 자리만 글자로 바꿨다.**

   것을 막으려고 넣은 글자가 조용히 거짓말을 하고 있었다.

   4차: 그 순간의 N 으로 **글자 폭을 재서 먼저 떼고**, 남은 폭으로 점 수를 정한다.
   N 은 점 수에 달렸고 점 수는 글자 폭에 달렸으므로 몇 번 돌려 수렴시킨다(자릿수가

   ⚠ 점이 다 들어가면 **글자를 아예 안 쓴다**(자리도 안 만든다). */
let qdotProbe=null;
function qdotTextW(txt){
  try{
    if(!txt) return 0;
    const band=document.getElementById('qband'); if(!band) return 0;
    if(!qdotProbe || !qdotProbe.isConnected){
      qdotProbe=document.createElement('i');
      qdotProbe.className='qmore';          // `.more` 와 **같은 CSS** 를 받는다
      band.appendChild(qdotProbe);
    }
    qdotProbe.textContent=txt;
    return Math.ceil(qdotProbe.getBoundingClientRect().width);
  }catch(e){ return 0; }
}
function fgDots(flash){
  try{
    const box=document.getElementById('qdots'); if(!box) return;
    const seen=Math.max(0,S.queue.length-(FG.veiled?FG.qHeld:0)), cap=qmax();
    const avail=Math.floor(box.getBoundingClientRect().width)||0;
    let size=QDOT_MAX, gap=QDOT_GAP_MAX, dotN=cap, rest=0;
    if(avail>0){
      // ⑴ 점이 **다 들어가는** 가장 큰 크기를 찾는다. 찾으면 글자는 없다.
      let allFit=false;
      for(size=QDOT_MAX; size>=QDOT_MIN; size--){
        gap = size>=6 ? QDOT_GAP_MAX : QDOT_GAP_MIN;
        if(cap*size+(cap-1)*gap <= avail){ allFit=true; break; }
      }
      if(allFit){ dotN=cap; rest=0; }
      else{
        // ⑵ 다 안 들어간다 — 가장 작은 점으로 최대한 많이 보이게 하고 나머지는 글자가 든다.
        size=QDOT_MIN; gap=QDOT_GAP_MIN;
        dotN=Math.max(0, Math.floor((avail+gap)/(size+gap))-1);
        for(let k=0;k<6;k++){
          const n=Math.max(0, seen-dotN);
          const tw=n>0?qdotTextW('+'+n):0;              // **글자 폭을 먼저 뗀다**
          const budget=avail-(tw>0?tw+gap:0);
          let nd=Math.max(0, Math.floor((budget+gap)/(size+gap)));
          if(nd>cap) nd=cap;
          if(nd===dotN) break;
          dotN=nd;
        }
        rest=Math.max(0, seen-dotN);
        if(dotN>=cap){ dotN=cap; rest=0; }              // 글자가 0 이면 자리도 안 쓴다
      }
    }
    const slots=dotN+(rest>0?1:0);
    if(box.children.length!==slots || box.dataset.size!==String(size)){
      box.innerHTML=''; for(let i=0;i<slots;i++) box.appendChild(document.createElement('i'));
      box.dataset.size=String(size);
    }
    box.style.gap=gap+'px';
    for(let i=0;i<dotN;i++){
      const d=box.children[i], it=i<seen?S.queue[i]:null;
      d.className=it?'on':'';
      d.style.width=d.style.height=size+'px';
      d.style.color=it?(GC[it.g]||'var(--line)'):'';
      d.textContent='';
      if(flash && it && i===seen-1){ void d.offsetWidth; d.classList.add('fresh');
        setTimeout(()=>{ try{ d.classList.remove('fresh'); }catch(e){} },900); }
    }
    if(rest>0){
      // **보이는 점 + N = 실제 대기 수.** 이 자리는 위에서 폭을 떼 놓은 자리다.
      const more=box.children[slots-1];
      more.className='more';
      more.style.width=''; more.style.height=''; more.style.color='';
      more.textContent='+'+rest;
    }
  }catch(e){}
}
// 드러난 문양 수를 부모 속성 하나로 알린다. CSS 가 그 뒤의 칸을 덮는다.
function fgPaint(){
  const f=fgEl(); if(!f||!f.setAttribute) return;
  FG.shown = FG.settled ? Math.min(FG.struck,FG.need) : 0;
  f.setAttribute('data-shown', String(FG.veiled?FG.shown:FG.need));
  /* 048 §2③ — 「드러났다」가 곧 「섰다」다. 앞에서 n 개가 서야 한다고 릴에 알린다.
     첫 타(정착 전)는 `shown` 이 0 이지만 **첫 릴은 그 순간 감속을 시작한다.** */
  try{ reelReveal(FG.veiled?Math.max(FG.shown,1):FG.need); }catch(e){}
  if(FG.veiled) f.setAttribute('data-veiled','1'); else f.removeAttribute('data-veiled');
  /* ⑤-4 「이은 고리」 — 드러난 문양 가운데 앞 문양과 같은 칸을 강조한다. CSS 클래스
     하나뿐이고(새 연출 없음), **드러난 칸만** 본다(가려진 칸을 보면 결과가 샌다). */
  try{
    const ks=[...document.querySelectorAll('#reels .reel')];
    const lim=FG.veiled?FG.shown:ks.length;
    ks.forEach((e,i)=>{
      const on = i>0 && i<lim && e.dataset && ks[i-1].dataset
              && e.dataset.p!=null && e.dataset.p===ks[i-1].dataset.p;
      e.classList.toggle('echo',!!on);
    });
  }catch(e){}
}

function fgDeny(why){
  FG.blocked[why]=(FG.blocked[why]||0)+1;

function strike(src){

  if(src==='hand'){ reelTouch();
    // 049 §2⑥ — **손 탭만** 판정한다. 견습생·마무리 타격은 판정하지 않는다(R3).
    try{ rhyJudge(strikeEv); }catch(e){} }
  if(!FG.veiled){
    /* 048 §2①④ — **이 주기가 공짜인가는 「처음 시작한 쪽」이 정한다.** 손이 열면
       공짜, 견습생이 열면 충전 1. 중간에 손이 섞여도 그 주기의 값은 안 바뀐다

    if(S.queue.length>=qmax() && !autoResOn()){ openCmp(); return; }
    if(!free && S.charge<1){ fgDeny('charge'); return; }   // 손은 충전을 안 본다
    if(S.queue.length>=qmax()){ fgDeny('queue'); return; } // 가득이면 손도 선다(원칙 8 · S2)
    fgQAt=S.queue.length;
    spin(free);
    // **시작했는지는 깃발이 아니라 `spinning` 으로 안다** — spin() 자신이
    // 조건을 다시 보고 아무 일도 안 할 수 있다.
    if(!spinning){ fgDeny((!free&&S.charge<1)?'charge':'queue'); return; }
    FG.free=free;
    FG.autoCycle=!free;                      // 049 F2 — 자동이 연 주기인가
    if(free) FG.handMade++;                  // 048 2차 ③ — 손이 연 주기 (R3 가 쓸 계수기)
    FG.veiled=true; FG.settled=false; FG.need=REELS(); FG.struck=1; FG.qHeld=0;
    try{ reelsStart(); }catch(e){}  // 048 — 릴이 돈다. 이 타가 곧 첫 멈춤이다.

  }else{
    FG.struck++;

       치는 순간부터는 굴리고 차례로 세운다(판정 절: 「손이 섞인 주기는 지금처럼」). */

/* 매 타의 손맛 — **기존** 불티·셰이크를 재사용한다(새 연출 금지 · R2 몫). */

    const V=globalThis.__view, an=V&&V.anvil;

      globalThis.__fxBurst(V&&V.reducedMotion?2:7, an.x, an.y, .55);

/* ⑤-8 손 놓으면 마저 친다 — 주기가 영원히 걸려 있는 일은 없다. */
function fgArmIdle(){
  if(typeof setTimeout!=='function') return;
  if(fgIdleT) clearTimeout(fgIdleT);
  fgIdleT=setTimeout(function step(){
    if(!FG.veiled) return;
    FG.idleFinish++;
    const left=Math.max(0,FG.need-FG.struck);
    let i=0;
    const beat=()=>{ if(!FG.veiled) return;
      strike('idle');
      if(FG.veiled && ++i<left) setTimeout(beat,FORGE_IDLE_STEP); };
    beat();
  }, FORGE_IDLE_MS);
}
/* ⑤-7 마무리 — 남은 문양을 다 열고 `#msg` 를 보인다. */
function fgFinish(){
  if(fgIdleT){ clearTimeout(fgIdleT); fgIdleT=null; }
  FG.veiled=false; FG.settled=false; FG.qHeld=0; FG.struck=0; FG.shown=FG.need;
  FG.made++;
  fgPaint();
  // ⑤-5 미뤄 둔 정렬 연출을 **여기서** 꺼낸다 — 마지막 문양이 드러나는 순간이다.
  if(fgPending){ const q=fgPending; fgPending=null;
    // 048 §2③ — 기준선을 **등급색**으로 켠다. 색은 이미 만들어진 장비의 등급이고
    // 새 색표를 만들지 않는다(GC — 원칙: 등급색 15종은 한 곳에서만 난다).
    try{ const rs=document.getElementById('reels');
      if(rs&&rs.style&&q.g) rs.style.setProperty('--payc',GC[q.g]||'var(--ember)'); }catch(e){}
    try{ if(typeof globalThis.__hitFx==='function') globalThis.__hitFx(q.hits,q.g); }catch(e){} }
  try{ renderFast(); fgDots(true); }catch(e){}

/* ⑤-2 정착 감지 — `spinning` 참→거짓을 rAF 로 본다. 정착 전에 쌓인 타격은

/* ══ 047 3차 ② — 정착 감지는 **상태**를 본다 (rAF 는 보조일 뿐) ═══════════
   2차까지는 `requestAnimationFrame` **에만** 기대 「`spinning` 이 참→거짓이 되는
   순간」을 잡았다. 그래서 rAF 가 멈추는 판(숨은 탭 · 화면 밖 iframe)에서는
   **주기가 가려진 채 영원히 서고 견습생이 아무것도 못 만들었다** — 검증 실측:

   걸려 있는 일은 없다」가 거기서 깨졌다.

   고치는 법은 «순간»을 «상태»로 바꾸는 것이다: 주기가 열려 있고(`veiled`)
   아직 정착 안 했고(`!settled`) `spinning` 이 거짓이면 — **어떻게 거기 왔든** —
   정착이다. 가장자리(이전 값)를 추적할 필요가 없다. 주기는 `spinning` 이 참일
   때만 열리므로(`strike()` 가 그렇게 연다) 이 식은 열자마자 참이 되지 않는다.

   그래서 **250ms 틱이 정착을 책임지고**, rAF 는 「250ms 를 기다리지 않고 빨리
   보이게」 하는 보조로만 남는다. 보조는 정착하는 순간 스스로 멈춘다 — 검증이

function fgSettle(){
  if(!FG.veiled || FG.settled || spinning) return false;
  FG.settled=true;
  FG.qHeld=Math.max(0,S.queue.length-fgQAt);       // 자동 판매면 0
  fgPaint();
  if(FG.struck>=FG.need) fgFinish(); else { try{ renderFast(); }catch(e){} }
  return true;
}
function fgWatch(){
  if(typeof requestAnimationFrame!=='function') return;   // rAF 가 없어도 틱이 든다
  if(fgRaf!==null) return;                                // 이미 돌고 있다
  const loop=()=>{
    fgSettle();
    if(FG.settled || !FG.veiled){ fgRaf=null; return; }    // 할 일이 끝났다
    fgRaf=requestAnimationFrame(loop);
  };
  fgRaf=requestAnimationFrame(loop);
}

function popAutores(el){

    el.classList.add(still?'popStill':'pop');
    setTimeout(()=>{ try{ el.classList.remove('pop','popStill'); }catch(e){} }, still?1200:1250);
  }catch(e){}
}

/* ══ 033 — 자동 정리 ══════════════════════════════════════════════════════
   방치하면 **5.3초**에 대기열 10칸이 차서 자동 제련이 선다(032 검증 실측). `days.js`

     같은 함수), 장착·판매는 수동 버튼이 부르는 `resolve()` 그대로다. 그래서 골드·
     토큰·천장·자동 판매 규칙이 수동과 한 푼도 다를 수 없다 — **다른 길이 없다.**
   ⚠ `resolve()` 는 CORE 이고 끝에서 `openCmp()` 를 부른다. 사람이 누른 흐름에서는
     그게 맞다(고른 뒤 다음 것을 이어서 본다). 자동에는 아니다 — 팝업이 혼자 열리고,
     그러면 아래 「팝업 존중」 때문에 자동 정리가 그 자리에서 영영 멈춘다. CORE 를

   ⚠ 등급이 2 이상 떨어지는 교체는 `resolve('equip')` 안에서 `confirm()` 을 띄운다.
     방치 중에 대화상자가 뜨면 게임이 통째로 멈춘다(브라우저가 스크립트를 세운다).
     `nw.wn` 을 몰래 세워 경고를 죽이지 않는다 — 그건 **사람이 손으로 누를 때** 뜰
     경고를 영구히 없애는 짓이다. 025 의 승천 호출이 쓰는 방식을 **그대로** 쓴다:
     부르는 동안만 `globalThis.confirm` 을 바꿔 끼고 `finally` 로 되돌린다. 판정은
     여전히 `power()` 하나다 — 「오르면 장착」에 예외를 두지 않는다.
   ⚠ 한 틱에 **대기열 한 칸만**. 연출·판정문이 한꺼번에 쏟아지지 않게.
   ⚠⚠ 장착은 칸을 **안 비운다** — `resolve('equip')` 은 밀려난 이전 장비를 대기열 맨
     앞에 도로 넣는다(원칙 8: 판매만이 대기열을 줄인다). 그래서 지시서가 적은 대로
     **밀려난 이전 장비는 그 자리에서 판다.** 둘은 한 칸에 대한 한 번의 정리다 —
     들어온 것 하나가 자리를 잡고, 나간 것 하나가 칸을 비운다. 쪼개서 다음 틱으로
     미루면 그 틱의 스핀이 「가득」으로 막힌다(실측: 100틱에 5회). */
function autoResolve(){
  if(!autoResOn()) return;                                // 041 ①
  if(S.queue.length<qmax()) return;                       // 막히는 순간에만 손댄다
  const cmp=document.getElementById('cmp');
  if(cmp && cmp.classList.contains('on')) return;         // 사람이 고르는 중이다
  const nw=S.queue[0]; if(!nw) return;
  const old=S.equip[nw.part]||null;
  const up=power({...S.equip,[nw.part]:nw})>power(S.equip);
  const act=up?'equip':'sell';
  const tag=it=>t('msg.item',t('part.'+it.part),t('ui.grade',it.g),ROMAN[it.lv||1]);
  const nwTag=tag(nw), oldTag=old?tag(old):'', gold0=S.gold;
  // 025 의 승천 호출과 **같은 방식**: 부르는 동안만 confirm 을 바꿔 끼고 finally 로 되돌린다.
  const c0=globalThis.confirm;
  let sold=false;
  try{
    globalThis.confirm=()=>true;
    resolve(act);                                         // ← 수동 버튼과 같은 함수
    if(act==='equip' && old && S.queue[0]===old){ resolve('sell'); sold=true; }
  } finally { globalThis.confirm=c0; }
  if(cmp) cmp.classList.remove('on');                     // resolve() 끝의 openCmp() 되돌리기
  const m=document.getElementById('msg');
  m.innerHTML = act==='equip'
    ? t('msg.sorted.equip',nwTag)+(sold?t('msg.sorted.sold',oldTag)+ciGold()+fmt(S.gold-gold0):'')
    : t('msg.sorted.sell',nwTag)+ciGold()+fmt(S.gold-gold0);
  m.className='';
}

/* 034: 정적 HTML 의 글자를 한 번에 갈아 끼운다. `data-s` 한 바퀴가 전부다 —
   글자마다 id 를 붙이거나 innerHTML 을 다시 짜지 않는다. HTML 안의 한국어는
   **원문 그대로 남겨 둔다**: 표에서 키가 빠지면 그 자리가 키 이름으로 바뀌어
   검사가 잡고, 스크립트가 죽어도 한국어 화면은 그대로 보인다.
   ⚠ 테크 버튼이 이미 `data-t`(테크 키)를 쓰고 있다 — 그래서 이 속성은 `data-s` 다. */
function i18nDom(){
  try{
    document.documentElement.lang=LANG;
    for(const e of document.querySelectorAll('[data-s]')) e.textContent=t(e.dataset.s);
    /* 041 ③ 2차 — `data-stitle` 은 **글자가 아니라 title**(마우스 올림)을 든다.
       짧게 줄인 안내 글자가 잃은 말을 폭 0 으로 되돌리는 자리다. `data-s` 와 같은
       한 바퀴 규약이라 다음에 쓸 자리가 생겨도 속성 하나로 끝난다. */
    for(const e of document.querySelectorAll('[data-stitle]')) e.title=t(e.dataset.stitle);
    document.title=t('doc.title');
  }catch(e){}
}
i18nDom();

  // ⚠ 카운터는 "재웠다"만 말한다. "화면이 맞다"는 픽셀로 따로 봐야 한다
  //   (CLAUDE.md 검증 세션 절 — 009 가 이 구멍으로 통과했다).
  // ⚠ `frames`/`framesFx` = **실제로 그린 프레임 수** (013 §0). 017 이 Phaser 를
  //   걷어내며 `loop.frame` 이 사라져 011 이 세운 「루프 가동률(duty)」 이 NaN 이
  //   됐다(016 에서 뒤 겹 3.2% / 앞 겹 10.3% 를 주던 식). 두 겹을 따로 재우므로
  //   카운터도 따로 둔다 — duty = frames / (경과초 × 60).
  //   **성능 검사는 렌더 실패를 보상한다**(CLAUDE.md): 프레임 간격만 보면 "안 그려서
  //   빨라진" 빌드가 더 좋아 보인다. 이 둘이 그 구멍을 메우는 짝이다.
  //   `hidden`/`hiddenSkips` = 019 §2. 숨은 탭에서 **건너뛴 연출의 수**다 —
  //   "안 그렸다"를 카운터로 말해야 duty ≤ 2% 가 우연이 아님을 보일 수 있다.
  perf:{bgBakes:0, panelBakes:0, moves:0, sleeping:false, wakes:0, sleeps:0,
    frames:0, framesFx:0, hidden:false, hiddenSkips:0,
    reelFrames:0},                     // 048 §2⑦ — 릴이 실제로 움직인 프레임 수
  // 026 — **노출되지 않는 것은 완료로 인정하지 않는다**(CLAUDE.md). 광고는
  // 자동 검사가 눈으로 볼 수 없는 연출이라 여기 전부 내건다.
  /* 049 §2⑥ — 박자 창구. 실제 값은 rhyView() 가 채운다. */
  // ⚠ `RHY_BPM` 을 여기 쓰면 안 된다 — VIEW 가 먼저 만들어져 TDZ 다(실측: 하네스가
  //   「Cannot access 'RHY_BPM' before initialization」으로 죽어 smoke·days 가 통째로 멈췄다).
  //   부팅 직후 `rhyView()` 가 같은 값으로 덮는다.
  rhythm:{bpm:120.15, clock:'perf', beat:0, phase:0, last:{grade:'',ms:0},
    counts:{perfect:0,great:0,good:0,miss:0}, combo:0, best:0, running:false},
  // 049 §2⑤ — 소리 창구. 실제 값은 아래 sndView() 가 채운다(부팅 전에는 ctx:'none').
  sfx:{ctx:'none', music:true, sfx:true, packs:{sfx:'none',forge:'none'}, bgm:'none',
       loopLen:0, played:{}, skipped:0, dropped:0, lat:0},
  plat:{env:'none', ready:false, adsOn:false, paused:false, blocked:false,
    ads:0, done:0, failed:0, adLeft:0, adReady:false, dadReady:false, err:'',
    rewardOn:false, mids:0, midDone:0}                                  // 037 ⑥
};
globalThis.__view=VIEW;                // 브라우저에선 window.__view. node 검증에서도 안 죽는다.

/* ══════════════════════════════════════════════════════════════════════════
   049 §2 — 소리.  **소리는 관찰자다**(040 원칙).

   CORE 에 소리 호출을 한 줄도 심지 않는다. 릴 사건은 VIEW 의 릴 상태 기계가, 전투는
   `VIEW.counters`·`S` 의 **변화**가 알려 준다. 그래서 이 절을 통째로 지워도 게임은
   한 글자도 안 달라진다 — 소리가 규칙을 만들지 않는다는 뜻이다.

   ⚠ node 하네스에는 `AudioContext`·`document`·`window` 가 없다. 바깥 세계를 만지는
     줄은 전부 `typeof` 로 가린다 — 041 ④ 에서 이걸 빠뜨려 `days.js` 가 죽고 md5 가
     빈 출력로 바뀐 적이 있다.
   ⚠ **첫 화면에는 아무것도 안 부른다.** 첫 사람 입력에서 `AudioContext` 를 만들고
     묶음을 싣는다(§2①). 자동재생 정책상 그 전에는 소리를 낼 수도 없다.
   ══════════════════════════════════════════════════════════════════════════ */
const SND={
  ctx:null, master:null, mGain:null, sGain:null,
  buf:{},                    // 키 → AudioBuffer
  packs:{sfx:'none', forge:'none'},
  bgm:'none', bgmSrc:null, loopLen:0, loopAt:0,   // loopAt = 반복이 시작된 ctx 시각
  music:true, sfx:true, cgMute:false,
  played:{}, skipped:0, dropped:0, lat:0,
  live:0, lastAt:{}, ascAt:[],
  boot:false,
};
/* ══ 049 — **소리는 게임의 난수를 먹지 않는다** ══════════════════════════
   피치 흔들림에 `Math.random()` 을 쓰면 효과음 한 번이 난수열을 한 칸 밀어 **장비
   등급이 달라진다.** 검사 R5(같은 시드에서 완벽만 친 판과 아쉬움만 친 판이 같은가)가
   그것을 잡았다 — 등급이 `[8,1,1,6,…]` 대 `[1,2,7,1,…]` 로 갈렸다.
   「소리는 관찰자다」(040)는 **난수에도** 걸린다. 소리는 제 난수를 쓴다. */
let sfxSeed=0x5EED049;
function sfxRnd(){ sfxSeed=(sfxSeed*1103515245+12345)&0x7fffffff; return sfxSeed/0x7fffffff; }
const SND_MAX=12;                      // 동시 발음 상한 — 넘으면 버린다(dropped++)
const SND_LOOP_LEN=127.840;            // 대장간 곡 반복 길이(초) · ±5ms 를 검사로 못박는다
const SND_BGM_VOL=0.35;

/* 저장은 `localStorage` 의 `hs.snd` 다 — **세이브 `S` 에 넣지 않는다**(저장 형식 불변). */
function sndLoadPrefs(){
  try{ const v=localStorage.getItem('hs.snd');
    if(typeof v==='string'&&v.length>=2){ SND.music=v[0]==='1'; SND.sfx=v[1]==='1'; }
  }catch(e){}
}
function sndSavePrefs(){
  try{ localStorage.setItem('hs.snd',(SND.music?'1':'0')+(SND.sfx?'1':'0')); }catch(e){}
}
/* CrazyGames 의 `muteAudio` 는 **게임 내 설정보다 우선한다**(SDK 문서). 그래서 켜져
   있는 동안에는 `#snd` 를 눌러도 소리가 안 난다 — 아래 `sndOnMusic`·`sndOnSfx` 가 못이다. */
const sndOnMusic=()=>SND.music && !SND.cgMute;
const sndOnSfx  =()=>SND.sfx   && !SND.cgMute;

function sndState(){
  if(!SND.ctx) return 'none';
  try{ return SND.ctx.state==='running'?'running':'suspended'; }catch(e){ return 'none'; }
}
/* `__view.sfx` — **깃발이 아니라 효과**를 낸다(026 AD6 교훈). `played` 는 실제로
   소리 노드를 만들어 예약한 수다. */
function sndView(){
  const V=globalThis.__view; if(!V) return;
  V.sfx={ctx:sndState(), music:SND.music, sfx:SND.sfx, cgMute:SND.cgMute,
    packs:{sfx:SND.packs.sfx, forge:SND.packs.forge},
    bgm:SND.bgm, loopLen:+SND.loopLen.toFixed(4),
    played:SND.played, skipped:SND.skipped, dropped:SND.dropped,
    lat:+SND.lat.toFixed(2), live:SND.live, ascAt:SND.ascAt};
}

/* ── 묶음 싣기 — `<script src>` 는 `file://` 에서도 된다(§2①) ─────────────── */
function sndPack(name){
  return new Promise(res=>{
    try{
      if(SND.packs[name]==='ready'||SND.packs[name]==='loading') return res(false);
      SND.packs[name]='loading'; sndView();
      const sc=document.createElement('script');
      sc.src='audio/pack-'+name+'.js';
      sc.onload=()=>{ sndDecodePack(name).then(()=>res(true)); };
      sc.onerror=()=>{ SND.packs[name]='none'; sndView(); res(false); };
      document.head.appendChild(sc);
    }catch(e){ SND.packs[name]='none'; res(false); }
  });
}
function b64buf(b64){
  const bin=atob(b64), n=bin.length, u=new Uint8Array(n);
  for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  return u.buffer;
}
async function sndDecodePack(name){
  const H=(typeof window!=='undefined')?window.HS_AUDIO:null;
  if(!H||!SND.ctx){ SND.packs[name]='none'; sndView(); return; }
  const keys=Object.keys(H).filter(k=>H[k]);
  for(const k of keys){
    try{
      const ab=b64buf(H[k]);
      // 끝나면 base64 문자열을 놓아 준다 — 2.6MB 짜리가 그대로 남으면 아깝다(§2①).
      H[k]=null;
      SND.buf[k]=await SND.ctx.decodeAudioData(ab);
    }catch(e){}
  }
  SND.packs[name]='ready'; sndView();
  if(name==='forge') sndBgmStart();
}

/* ── 켜기 — **첫 사람 입력**에서 한 번 ──────────────────────────────────── */
function sndBoot(){
  if(SND.boot) return; SND.boot=true;
  try{
    const AC=(typeof AudioContext!=='undefined')?AudioContext
            :(typeof webkitAudioContext!=='undefined')?webkitAudioContext:null;
    if(!AC||typeof document==='undefined') return;
    SND.ctx=new AC();
    SND.master=SND.ctx.createGain(); SND.master.gain.value=1; SND.master.connect(SND.ctx.destination);
    SND.mGain=SND.ctx.createGain(); SND.mGain.gain.value=0; SND.mGain.connect(SND.master);
    SND.sGain=SND.ctx.createGain(); SND.sGain.gain.value=1; SND.sGain.connect(SND.master);
    sndView();
    /* ══ 049 2차 ③ — **첫 주기를 지킨다** ═══════════════════════════════════
       1차는 첫 입력에서 `sfx`(0.8MB) 에 이어 **곧바로 `forge`(2.6MB)** 를 실었다.
       base64 를 풀고 디코딩하는 동안 메인 스레드가 막혀 **rAF 가 밀렸고**, 그래서
       첫 주기에서 릴 멈춤 둘이 34ms·15ms 로 붙는 판이 났다(검증 ② 의 「새 흔들림」).
       첫 주기는 사람이 이 게임을 처음 보는 자리다 — 거기서 손맛이 흔들리면 안 된다.
       그래서 배경음악 묶음은 **첫 주기가 정착한 뒤** 한가한 틈에 싣는다. */
    sndPack('sfx');
    sndForgeLater();
  }catch(e){ SND.ctx=null; sndView(); }
}

/* 049 2차 ③ — 배경음악 묶음을 **첫 주기가 끝난 뒤 · 한가한 틈에** 싣는다.
   ⚠ 「첫 주기 정착」은 `FG.made` 가 처음 오르는 때다. 그 전에 손을 떼도 마무리가
     주기를 끝내므로(047 ⑤-8) 영영 안 실리는 일은 없다. 그래도 보루로 8초를 둔다.
   ⚠ `requestIdleCallback` 이 없는 브라우저(사파리 계열)에서는 1초 뒤 `setTimeout`. */
let sndForgeArmed=false;
function sndForgeLater(){
  if(sndForgeArmed) return; sndForgeArmed=true;
  const go=()=>{ try{ sndPack('forge'); }catch(e){} };
  const idle=()=>{ try{
      if(typeof requestIdleCallback==='function') requestIdleCallback(go,{timeout:2000});
      else if(typeof setTimeout==='function') setTimeout(go,1000);
      else go();
    }catch(e){ go(); } };
  if(typeof setTimeout!=='function'){ go(); return; }
  const made0=(typeof FG==='object'&&FG)?FG.made:0;
  let waited=0;
  const tick=()=>{
    waited+=120;
    const done=(typeof FG==='object'&&FG&&FG.made>made0);
    if(done || waited>=8000){ idle(); return; }
    setTimeout(tick,120);
  };
  setTimeout(tick,120);
}

/* ── 한 소리 ─────────────────────────────────────────────────────────────
   `gap` 은 「이 키를 N ms 안에 다시 내지 않는다」 — 전투 소리처럼 쏟아지는 것에만 건다.
   **탭 효과음에는 걸지 않는다**: 사람이 친 만큼 소리가 나야 한다(§2③). */
function sfx(key,opt){
  opt=opt||{};
  try{
    if(!SND.ctx||!sndOnSfx()){ SND.skipped++; return 0; }
    if(SND.ctx.state!=='running'){ SND.skipped++; return 0; }
    const b=SND.buf[key]; if(!b){ SND.skipped++; return 0; }
    const now=SND.ctx.currentTime;
    if(opt.gap){ const t=SND.lastAt[key]||-1e9;
      if((now-t)*1000<opt.gap){ SND.skipped++; return 0; } }
    if(SND.live>=SND_MAX){ SND.dropped++; return 0; }
    SND.lastAt[key]=now;
    const src=SND.ctx.createBufferSource(); src.buffer=b;
    if(opt.rate) src.playbackRate.value=opt.rate;
    const g=SND.ctx.createGain(); g.gain.value=(opt.vol==null?1:opt.vol);
    src.connect(g); g.connect(SND.sGain);
    const at=now+(opt.at||0);
    src.start(at);
    SND.live++; src.onended=()=>{ SND.live=Math.max(0,SND.live-1); };
    SND.played[key]=(SND.played[key]||0)+1;
    sndView();
    return at;
  }catch(e){ return 0; }
}
// 040 의 합성 둘 — 파일이 없는 소리는 즉석에서 만든다(에셋을 늘리지 않는다).
function sfxTone(kind){
  try{
    if(!SND.ctx||!sndOnSfx()||SND.ctx.state!=='running'){ SND.skipped++; return; }
    if(SND.live>=SND_MAX){ SND.dropped++; return; }
    const t=SND.ctx.currentTime, o=SND.ctx.createOscillator(), g=SND.ctx.createGain();
    const hit=(kind==='hit');
    o.type=hit?'square':'sawtooth';
    o.frequency.setValueAtTime(hit?420:220,t);
    o.frequency.exponentialRampToValueAtTime(hit?260:90,t+(hit?0.07:0.28));
    g.gain.setValueAtTime(hit?0.25:0.3,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(hit?0.09:0.32));
    o.connect(g); g.connect(SND.sGain); o.start(t); o.stop(t+(hit?0.1:0.34));
    SND.live++; o.onended=()=>{ SND.live=Math.max(0,SND.live-1); };
    SND.played[kind]=(SND.played[kind]||0)+1; sndView();
  }catch(e){}
}

/* ── 배경음악 — 도입 한 번 → 반복 무한(예약) ────────────────────────────── */
function sndBgmStart(){
  try{
    if(!SND.ctx||!SND.buf['bgm-loop']) return;
    // 양 끝 0 샘플을 **잘라** 반복 길이를 맞춘다 — 그 몇 ms 가 「뚝」 소리가 된다(§2②).
    SND.loopLen=sndTrim(SND.buf['bgm-loop']);
    const t0=SND.ctx.currentTime+0.06;
    const intro=SND.buf['bgm-intro'];
    let at=t0;
    if(intro){ const s=SND.ctx.createBufferSource(); s.buffer=intro;
      s.connect(SND.mGain); s.start(t0); at=t0+intro.duration; SND.bgm='intro'; }
    const l=SND.ctx.createBufferSource(); l.buffer=SND.buf['bgm-loop'];
    l.loop=true; l.loopStart=SND.trimA; l.loopEnd=SND.trimB;
    l.connect(SND.mGain); l.start(at,SND.trimA);
    SND.bgmSrc=l; SND.loopAt=at;
    if(!intro) SND.bgm='loop';
    else if(typeof setTimeout==='function')
      setTimeout(()=>{ SND.bgm='loop'; sndView(); }, Math.max(0,(at-SND.ctx.currentTime)*1000));
    // 1초 페이드인
    SND.mGain.gain.setValueAtTime(0.0001,t0);
    SND.mGain.gain.exponentialRampToValueAtTime(sndOnMusic()?SND_BGM_VOL:0.0001,t0+1);
    sndView();
  }catch(e){}
}
/* 양 끝의 **무음**을 찾아 반복 구간을 정한다. 0 이 아니라 아주 작은 값까지 무음으로 본다
   (mp3 디코딩은 정확히 0 을 잘 안 준다). 못 찾으면 통째로 쓴다. */
function sndTrim(b){
  try{
    const d=b.getChannelData(0), n=d.length, sr=b.sampleRate, eps=1e-4;
    let a=0, z=n-1;
    while(a<n && Math.abs(d[a])<eps) a++;
    while(z>a && Math.abs(d[z])<eps) z--;
    SND.trimA=a/sr; SND.trimB=(z+1)/sr;
    return SND.trimB-SND.trimA;
  }catch(e){ SND.trimA=0; SND.trimB=b.duration; return b.duration; }
}
function bgmGain(v,sec){
  try{ if(!SND.ctx||!SND.mGain) return;
    const t=SND.ctx.currentTime;
    SND.mGain.gain.cancelScheduledValues(t);
    SND.mGain.gain.setValueAtTime(Math.max(0.0001,SND.mGain.gain.value),t);
    SND.mGain.gain.exponentialRampToValueAtTime(Math.max(0.0001,v),t+(sec||0.4));
  }catch(e){}
}
// 피버 곡·화로 곡 전환 — **자리만**. 부르는 곳이 없다(R2b·R3 몫).
function bgmSwitch(name){ return name; }

/* ── 끄고 켜기 ───────────────────────────────────────────────────────────── */
function sndApply(){
  try{
    if(SND.mGain) bgmGain(sndOnMusic()?SND_BGM_VOL:0.0001,0.3);
    const sb=document.getElementById('snd');
    const on=(SND.music||SND.sfx)&&!SND.cgMute;
    if(sb){ sb.textContent=on?'🔊':'🔇'; sb.setAttribute('aria-pressed',on?'true':'false'); }
    const m=document.getElementById('sndMusic'), x=document.getElementById('sndSfx');
    if(m) m.className=sndOnMusic()?'hot':'';
    if(x) x.className=sndOnSfx()?'hot':'';
  }catch(e){}
  sndView();
}
/* 광고 중(`PLAT.paused`)·탭 숨김이면 **문맥을 재운다** — 깃발이 아니라 `ctx.suspend()` 다.
   돌아오면 `resume()` + 음악 1초 페이드인(§2④). */
function sndGate(){
  try{
    if(!SND.ctx) return;
    const stop=(typeof PLAT==='object'&&PLAT&&PLAT.paused)
            || (typeof document!=='undefined'&&document.hidden);
    if(stop && SND.ctx.state==='running') SND.ctx.suspend();
    else if(!stop && SND.ctx.state==='suspended'){
      SND.ctx.resume().then(()=>{ bgmGain(sndOnMusic()?SND_BGM_VOL:0.0001,1); }).catch(()=>{});
    }
    sndView();
  }catch(e){}
}
/* ══ 049 §2③ — **관찰자 배선**. 소리가 규칙을 만들지 않는다 ═══════════════
   릴 사건은 VIEW 의 릴 상태 기계가, 전투는 `VIEW.counters`·`S` 의 **변화**가 알려
   준다. CORE 에는 한 줄도 안 들어간다. */
let sfxClank=0, sfxTing=0, sfxThud=0;
function sfxReelStop(i){
  const r=RL[i]; if(!r) return;
  const prev=(i>0&&RL[i-1])?RL[i-1]:null;
  const stoodBefore=prev&&(prev.st==='stopped'||prev.st==='locked');
  const same=stoodBefore&&prev.sym===r.sym;
  // 탭 → 소리까지의 지연을 낸다(§2③ — 예약 기준 ≤30ms)
  const t=sfx(same?('sfx-ting-'+'abc'[(sfxTing++)%3])
                 :('sfx-clank-'+(((sfxClank++)%2)?'b':'a')),
    same?{}:{rate:1+(sfxRnd()*0.06-0.03)});          // 피치 ±3% — **제 난수**로(위 ⚠)
  if(t&&SND.ctx&&reelHumanAt) SND.lat=Math.max(0,(t-SND.ctx.currentTime)*1000);
  /* 「마지막 릴이 섰다 = 장비가 나왔다」는 **여기서 세지 않는다.** 이 함수가 도는
     순간의 상태를 훑으면 한 칸이 다른 길(스냅·자동)로 서 있을 때 새어 버린다
     (실측: 3릴 10주기에 thud 0 · clank 20). 전이를 이미 아는 곳은 `reelMark()` 다. */
}
function sfxSlam(){                                   // 자동의 «쾅» — 한 번에 선다
  try{ if(FG.made>=sfxMadeSeen){ sfxMadeSeen=FG.made+1; sfxMade(); } }catch(e){ sfxMade(); }
}
function sfxMade(){
  sfx('sfx-thud-'+(((sfxThud++)%2)?'b':'a'));
  try{
    const lit=document.querySelectorAll('#forge[data-match] .reel.done.hit').length;
    if(lit>=2) sfx('sfx-match',{at:0.07});
    const it=S.queue[S.queue.length-1];
    if(it&&(it.g||0)>=10) sfx('sfx-legend',{at:0.12});
  }catch(e){}
}
/* 전투·웨이브 — 카운터와 `S` 의 **변화**만 본다. 250ms 틱이 부른다. */
let sfxSeen={dissolve:0, attack:0, wave:0, star:0, lv:0, tech:0};
function sfxWatch(){
  try{
    const V=globalThis.__view; if(!V||!SND.ctx) return;
    const c=V.counters||{};
    if((c.dissolve||0)>sfxSeen.dissolve){ sfxSeen.dissolve=c.dissolve;
      sfx('sfx-kill-'+((sfxSeen.dissolve%2)?'b':'a'),{vol:0.6,gap:120}); }
    if((c.attack||0)>sfxSeen.attack){ sfxSeen.attack=c.attack; sfxTone('hit'); }
    if(S.wave>sfxSeen.wave){ const back=false; sfxSeen.wave=S.wave; sfx('sfx-wave',{gap:3000}); }
    else if(S.wave<sfxSeen.wave){ sfxSeen.wave=S.wave; sfxTone('fail'); }
    if((S.star||0)>sfxSeen.star){ sfxSeen.star=S.star||0; sfxAscend(); }
    const tech=Object.values(S.tech||{}).reduce((a,c2)=>a+c2,0);
    if(tech>sfxSeen.tech){ sfxSeen.tech=tech; sfx('sfx-chime'); }
  }catch(e){}
}
/* 승천 — 곡을 −12dB 로 눌렀다가 라이저 → 파이널 → **도입부터** 다시 1.5초 페이드인.
   순서를 `__view.sfx.ascAt` 에 시각으로 적는다(A9 가 그것을 읽는다). */
function sfxAscend(){
  try{
    if(!SND.ctx) return;
    const t=SND.ctx.currentTime; SND.ascAt=[];
    bgmGain(SND_BGM_VOL*0.25,0.25);              SND.ascAt.push(['duck',+t.toFixed(3)]);
    const a=sfx('sfx-ascend-riser');             if(a) SND.ascAt.push(['riser',+a.toFixed(3)]);
    const b=sfx('sfx-final-strike',{at:4});      if(b) SND.ascAt.push(['final',+b.toFixed(3)]);
    if(typeof setTimeout==='function') setTimeout(()=>{
      try{ if(SND.bgmSrc){ SND.bgmSrc.stop(); SND.bgmSrc=null; }
        SND.bgm='none'; sndBgmStart();
        SND.ascAt.push(['bgm',+SND.ctx.currentTime.toFixed(3)]); sndView();
      }catch(e){}
    },4300);
    SND.bgm='duck'; sndView();
  }catch(e){}
}

/* CrazyGames 의 `muteAudio` — **SDK 문서에서 확인한 이름**이다(추측 아님):
   `SDK.game.settings.muteAudio` + `addSettingsChangeListener`. 문서가 「이 설정이
   게임 내 설정보다 우선한다」고 못박아, 켜져 있으면 `#snd` 로도 못 켠다. */
/* 저장해 둔 설정을 읽는다 — **SND 가 다 만들어진 뒤**여야 한다(위 ⚠). */
try{ sndLoadPrefs(); sndApply(); }catch(e){}

/* ══════════════════════════════════════════════════════════════════════════
   049 §2⑥ — 박자. 모루 밑 메트로놈 + 판정 게이지.

   **이번엔 보이고 판정하는 것까지다 — 판정이 게임에 주는 이득은 0.**
   그래서 이 절은 `S` 를 한 글자도 안 쓰고 CORE 를 안 부른다(검사 R5 가 그것을 잰다).
   R2b 가 여기에 보상(피버·「대장장이의 감!」·불씨)을 붙인다.

   ⚠ 049 2차 ④ 로 **시계는 하나다**(아래 `rhyNow`·`rhyRef`·`rhySlide` 의 긴 주석).
     그리고 재는 자는 `performance.now()` 하나 — 곡(`ctx.currentTime`)은 **기준**으로만
     쓰고, 그 기준 쪽으로 프레임마다 박의 0.4%씩 민다. 1차처럼 갈아타면 그 프레임에
     바늘이 튀고(~104ms), 오디오 시계로 직접 그리면 프레임마다 떨린다(6.4%).
   ⚠ 탭 시각은 `PointerEvent.timeStamp`(= `performance` 기준)로 온다 — 재는 자가
     그것 하나이므로 변환이 없다.
   ⚠ **판정은 릴 멈춤을 막지 않는다.** 어느 판정이든 탭은 그 릴을 세운다.
   ══════════════════════════════════════════════════════════════════════════ */
const RHY_BPM=120.15, RHY_BEAT=60/RHY_BPM;          // 0.49938 초
const RHY_PERFECT=45, RHY_GREAT=90, RHY_GOOD=140;   // ms
const RHY_TICKS=6;                                  // 게이지에 남기는 눈금 수
const RHY={ origin:null, clock:'perf', beat:0, phase:0, edge:-1, raf:null,
            last:{grade:'', ms:0}, counts:{perfect:0,great:0,good:0,miss:0},
            combo:0, best:0, ticks:[] };

/* ⚠ 049 2차 ④ — **시계 하나로 그린다.** 바늘·판정은 늘 성능 시계(`performance.now`)로
     세고, 곡(오디오 시계)은 **기준**으로만 쓴다. 1차는 음악이 돌면 오디오 시계로
     **갈아탔다** — 그래서 두 가지가 났다:
       ⑴ 갈아타는 그 프레임에 바늘이 튀었다(검증 세션 실측 ~104ms).
       ⑵ `ctx.currentTime` 은 렌더 블록 단위로 ~10ms씩 **뛴다**. 그것으로 직접 그리면
          바늘이 프레임마다 떨린다(2차 실측: 한 프레임 6.4% · 한계 5%).
     그리고 음악을 **끈** 사람도 갈아탔다(버퍼는 무음으로 돌기 때문에).
     그래서: 성능 시계로 매끄럽게 그리고, 곡과의 차이는 프레임마다 박의 0.4%(≈2ms)
     씩만 **밀어서** 따라간다(`rhySlide` — 느린 위상 추적). 뛰는 값을 평균 내어
     받으므로 바늘이 안 떨리고, 오디오·성능 두 시계의 **속도 차이도 계속 흡수**된다
     (1차의 한 번 박기와 달리 2분 뒤에도 안 밀린다 — R1).
   `RHY.clock` 의 뜻: `'audio'` = 곡에 물려 있다 · `'perf'` = 맞출 곡이 없어 혼자 돈다. */
function rhyPerf(){
  return (typeof performance==='object'&&performance.now)?performance.now()/1000:Date.now()/1000;
}
function rhyNow(){ return rhyPerf(); }               // 그리는 시계는 늘 이것 하나다
/* 곡이 **들리게** 돌면 그 박에 맞는 기준점을 성능 시계 자로 바꿔 돌려준다.
   음악을 껐으면(`sndOnMusic()` 거짓) `null` — 맞출 곡이 없다. */
function rhyRef(){
  try{
    if(sndOnMusic() && SND.ctx && SND.ctx.state==='running' && SND.bgm!=='none' && SND.loopAt)
      return rhyPerf() - (SND.ctx.currentTime - SND.loopAt);
  }catch(e){}
  return null;
}
const RHY_SLIDE=RHY_BEAT*0.004;                      // 한 프레임에 밀 수 있는 최대(초)
const RHY_FRAME_CAP=RHY_BEAT*0.048;                  // 한 프레임에 바늘이 갈 수 있는 몫
function rhyOrigin(){
  if(RHY.origin===null) RHY.origin=rhyPerf();
  return RHY.origin;
}
/* 곡 쪽으로 **조금씩** 민다. 프레임마다 한 번(8ms 안에 두 번 부르면 뒤는 무시).
   ⚠ 0.4%(2ms)는 넉넉히 잡은 값이다. 60fps 한 프레임이 이미 박의 3.3%(16.7ms)를
     먹으므로, 미는 몫까지 더해도 5% 아래로 남는다. 반 박을 당기는 데 2초쯤 걸리지만
     그 2초는 **32초 도입부 안**이라 곡의 박이 아직 안 들린다. 미는 동안에도 바늘과
     판정은 **같은 기준점**이라 「바늘에 맞춰 친 탭」은 그대로 완벽이다. */
function rhySlide(){
  const now=rhyPerf();
  const dt=(RHY._slid===undefined)?0.016:(now-RHY._slid);
  if(dt<0.008) return;                               // 한 프레임에 한 번
  RHY._slid=now;
  const want=rhyRef();
  RHY.clock=(want===null)?'perf':'audio';
  RHY._want=want;
  if(want===null){ RHY._hold=0; return; }
  rhyOrigin();
  /* 이 프레임의 몫 — **실제로 흐른 시간**이 이미 한 프레임 몫(박의 4.8%)을 먹었으면
     밀지 않는다. 그래야 rAF 가 밀린 프레임에서 바늘이 더 건너뛰지 않는다.
     다만 느린 기기(30fps)에서 영영 못 맞추면 안 되니, 30프레임을 내리 쉬었으면 한 번은 민다. */
  let step=Math.min(RHY_SLIDE, Math.max(0, RHY_FRAME_CAP-dt));
  if(step<=0){ RHY._hold=(RHY._hold||0)+1; if(RHY._hold<30) return; step=RHY_SLIDE; }
  RHY._hold=0;
  let d=(want-RHY.origin)%RHY_BEAT;                  // 박 하나 안의 차이로 접는다
  if(d>RHY_BEAT/2) d-=RHY_BEAT; else if(d<-RHY_BEAT/2) d+=RHY_BEAT;
  RHY.origin += (Math.abs(d)<=step) ? d : (d>0?step:-step);
}
function rhyPhase(now){
  const t=now-rhyOrigin();
  const b=Math.floor(t/RHY_BEAT);
  return {beat:b, phase:t/RHY_BEAT-b};
}
/* 사람의 탭 시각(초). `PointerEvent.timeStamp` 가 곧 성능 시계다 — 이제 바꿀 일이 없다
   (1차는 `getOutputTimestamp()` 로 오디오 시계에 옮겼다. 시계가 하나뿐이니 그 변환도,
   변환이 실패할 때의 어림짐작도 사라졌다). */
function rhyTapTime(ev){
  return (ev&&typeof ev.timeStamp==='number'&&ev.timeStamp>0) ? ev.timeStamp/1000 : rhyPerf();
}
/* 손 탭 하나를 판정한다. **견습생 타격은 여기 안 온다**(검사 R3). */
function rhyJudge(ev){
  try{
    const now=rhyTapTime(ev);
    const p=rhyPhase(now);
    // 가장 가까운 박까지의 시차(ms). phase 0.5 를 넘으면 다음 박이 가깝다.
    const d=(p.phase<=0.5?p.phase:p.phase-1)*RHY_BEAT*1000;
    const a=Math.abs(d);
    const g = a<=RHY_PERFECT?'perfect' : a<=RHY_GREAT?'great' : a<=RHY_GOOD?'good' : 'miss';
    RHY.counts[g]++;
    RHY.last={grade:g, ms:+d.toFixed(1)};
    if(g==='miss') RHY.combo=0;
    else { RHY.combo++; if(RHY.combo>RHY.best) RHY.best=RHY.combo; }
    // 이른 탭은 왼쪽, 늦은 탭은 오른쪽. RHY_GOOD 을 반폭으로 잡아 자리를 낸다.
    RHY.ticks.push({x:Math.max(-1,Math.min(1,d/RHY_GOOD)), g});
    while(RHY.ticks.length>RHY_TICKS) RHY.ticks.shift();
    rhyPaintTicks(); rhyShowJudge(g);
    rhyView();
  }catch(e){}
}
const RHY_COL={perfect:'#dfb96f', great:'var(--ember)', good:'#e9eef5', miss:'#6b7686'};
function rhyPaintTicks(){
  try{
    const box=document.getElementById('beatticks'); if(!box) return;
    const n=RHY.ticks.length;
    if(box.children.length!==n){ box.innerHTML='';
      for(let i=0;i<n;i++) box.appendChild(document.createElement('i')); }
    for(let i=0;i<n;i++){
      const t=RHY.ticks[i], e=box.children[i];
      e.style.left=(50+t.x*28)+'%';
      e.style.background=RHY_COL[t.g]||'#fff';
      e.style.opacity=String(0.18+0.82*((i+1)/n));     // 앞의 것은 흐리게 남는다
    }
  }catch(e){}
}
function rhyShowJudge(g){
  try{
    const e=document.getElementById('beatjudge'); if(!e) return;
    e.textContent=t('judge.'+g)+(RHY.combo>=2?(' '+t('judge.combo',RHY.combo)):'');
    e.style.color=RHY_COL[g]||'#fff';
    e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
  }catch(e){}
}
/* 바늘. 한 박에 **한 번** 좌↔우를 건넌다 — 끝에 닿는 순간이 곧 박이다
   (한 박에 왕복시키면 끝에 두 번 닿아 박이 두 배로 보인다). */
function rhyFrame(){
  try{
    const now=rhyNow();
    rhyOrigin(); rhySlide();                  // 049 2차 ④ — 프레임마다 한 번만 민다
    const p=rhyPhase(now);
    RHY.beat=p.beat; RHY.phase=p.phase;
    const red=reelRed();
    const n=document.getElementById('beatneedle'), bar=document.getElementById('beat');
    if(bar){
      if(!red && n){
        const x=(p.beat%2===0)?p.phase:(1-p.phase);
        n.style.left=(2+x*96)+'%';
      }
      if(p.beat!==RHY.edge){                        // 박이 바뀌는 그 순간
        RHY.edge=p.beat;
        bar.classList.remove('edge'); void bar.offsetWidth; bar.classList.add('edge');
        if(typeof setTimeout==='function') setTimeout(()=>{ try{ bar.classList.remove('edge'); }catch(e){} },90);
        const d=document.getElementById('beatdot');
        if(red&&d){ d.classList.add('on');
          if(typeof setTimeout==='function') setTimeout(()=>{ try{ d.classList.remove('on'); }catch(e){} },120); }
      }
    }
    rhyView();
  }catch(e){}
}
/* 돌 때만 돈다 — 048 2차 ① 과 **같은 규칙**이다(보고 있고, 30초 안에 만졌을 때).
   제련 탭이 아니면 아예 안 돈다. 그래서 유휴 duty 가 048 과 같다(검사 R6). */
function rhyShould(){
  try{
    if(typeof document==='undefined'||document.hidden) return false;
    const pane=document.getElementById('tabForge');
    if(!pane||!pane.classList||!pane.classList.contains('on')) return false;
    return (Date.now()-(reelHumanAt||0))<REEL_IDLE_MS;
  }catch(e){ return false; }
}
function rhyLoop(){
  if(typeof requestAnimationFrame!=='function') return;
  if(RHY.raf!==null) return;
  const step=()=>{
    if(!rhyShould()){ RHY.raf=null; rhyView(); return; }
    rhyFrame();
    RHY.raf=requestAnimationFrame(step);
  };
  RHY.raf=requestAnimationFrame(step);
}
function rhyView(){
  const V=globalThis.__view; if(!V) return;
  V.rhythm={bpm:RHY_BPM, clock:RHY.clock, beat:RHY.beat, phase:+RHY.phase.toFixed(4),
    last:{grade:RHY.last.grade, ms:RHY.last.ms},
    counts:RHY.counts, combo:RHY.combo, best:RHY.best,
    running:RHY.raf!==null, sliding:!(RHY._want===null||RHY._want===undefined),
    window:{perfect:RHY_PERFECT, great:RHY_GREAT, good:RHY_GOOD}};
}
rhyView();


function sndCgWatch(sdk){
  try{
    if(!sdk||!sdk.game) return;
    const read=st=>{ SND.cgMute=!!(st&&st.muteAudio); sndApply(); };
    read(sdk.game.settings);
    if(typeof sdk.game.addSettingsChangeListener==='function')
      sdk.game.addSettingsChangeListener(read);

}


// 017: Phaser 를 걷어냈다. 남은 것은 브라우저 2D 캔버스뿐이다.
// **브라우저 판별은 requestAnimationFrame 으로 한다** — 옛 `typeof Phaser` 자리다.
// node 하네스(tools/harness.js)에는 rAF 도 실제 캔버스도 없으므로 이 블록을 통째로
// 건너뛴다. 하네스는 CORE 검사용이고 화면은 검사 대상이 아니다(011 이 SVG 폴백을
// 지울 때 세운 규약과 같다).
if(typeof requestAnimationFrame!=='undefined' && typeof document!=='undefined'
   && document.getElementById('stage')){
  // 화면 좌표를 재는 대상. 캔버스는 고정(fixed)이라 스크롤하면 어긋나므로
  // 매 프레임 사각형을 확인하고 **바뀐 프레임에만** 다시 그린다.
  const rectOf=id=>{ const e=document.getElementById(id); if(!e) return null;
    const r=e.getBoundingClientRect();
    return {x:r.left, y:r.top, w:r.width, h:r.height}; };
  const same=(a,b)=>a&&b&&Math.abs(a.x-b.x)<.5&&Math.abs(a.y-b.y)<.5&&
                    Math.abs(a.w-b.w)<.5&&Math.abs(a.h-b.h)<.5;
  // 0xRRGGBB → 캔버스 색 문자열. 팔레트 상수(C_IRON…)는 그대로 두고 여기서만 푼다.
  const hex=c=>'#'+c.toString(16).padStart(6,'0');
  const rgba=(c,a)=>`rgba(${c>>16&255},${c>>8&255},${c&255},${a})`;

  const mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  VIEW.reducedMotion = !!(mq && mq.matches);
  if(mq && mq.addEventListener) mq.addEventListener('change',e=>{ VIEW.reducedMotion=e.matches; });

  /* ── 두 겹의 캔버스 ─────────────────────────────────────────────────
     Phaser 가 해 주던 일은 이것이 전부였다: 부모에 <canvas> 를 만들고, 화면
     크기로 맞추고, rAF 를 돌린다. 실제로 쓰던 API 도 Game·AUTO·Scale.RESIZE
     넷뿐이었다(013b 실측). 그래서 아래 30줄이 vendor 1.14MB 을 대신한다.
     ⚠ **해상도는 CSS 픽셀 1:1 로 둔다.** Phaser 3 도 그랬다. devicePixelRatio 로
     올리면 선이 또렷해지는데, 그것이 곧 "화면이 달라졌다"이고 017 의 성공 조건과
     정면으로 부딪힌다. 제안 절에 적어 올렸다. */
  function mkLayer(id){
    const h=document.getElementById(id); if(!h) return null;
    const c=document.createElement('canvas');
    c.style.width='100%'; c.style.height='100%';   // 부모는 position:fixed;inset:0
    h.appendChild(c);
    return {el:c, ctx:c.getContext('2d')};
  }
  const L_BG=mkLayer('stage'), L_FX=mkLayer('fx');

  let CW=0, CH=0;                       // 캔버스 CSS 크기 (= __view.canvas)
  let bgCan=null, bgCtx=null;           // 배경을 구워 두는 오프스크린
  let pnCan=null, pnCtx=null;           // 가운데 패널을 구워 두는 오프스크린
  let rF=null, rH=null, rV=null;        // #forge · #hearth · #focus 사각형
  let shakeUntil=0, shakeAmp=0;         // 카메라 셰이크

  /* ⚠ 009~010 을 두 세션 잡아먹은 RenderTexture 함정 둘이 **여기엔 존재하지 않는다.**
       ① 원점: 2D 캔버스는 언제나 좌상단 기준이다. setOrigin 이라는 개념이 없다.
       ② 크기 변경: `canvas.width=w` 는 버퍼를 새로 잡고 지울 뿐, 그 뒤의 그리기가
          망가지지 않는다. destroy/재생성이 필요 없어 makeBg·panelRT 두 함수가
          아래 두 줄로 줄었다. 013b 가 이관 근거로 든 자리가 이것이다. */
  const sizeCan=(c,w,h)=>{ if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } return c; };

  /* ── 방사 그라디언트 (017 의 유일한 그림 변경) ──────────────────────
     008 이 잔광을 타원 26장(배경)·12장(화로)으로 만든 이유는 Phaser Graphics 에
     방사 그라디언트가 **없어서**였다. 2D 캔버스에는 있다.
     **곡선은 새로 고르지 않고 옛 스택의 누적 알파를 그대로 옮긴다** — 017 의
     성공 조건이 "눈에 보이는 변화 0"이기 때문이다. 층 t 의 알파가 a/N·(1−.35t)
     이고 반지름 r 인 점은 t≥r 인 층 전부에 덮이므로
        A(r) = a·∫ᵣ¹(1−.35t)dt = a·[(1−r) − .175(1−r²)]
     캔버스 방사 그라디언트는 원형뿐이라 세로만 눌러 타원으로 만든다. */
  function glow(g,cx,cy,rx,ry,a,N,dy){
    // ⚠ 화로 잔광의 타원 12장은 **동심이 아니었다** — 중심이 base−.08h·t 로 t 와
    //   함께 움직였다. 즉 전체가 (cx,cy) 를 중심으로 한 **닮음 확대** 족이고,
    //   캔버스 방사 그라디언트의 두 원이 그리는 것이 정확히 그 닮음이다. 끝 원을
    //   (0,dy,rx) 로 두면 층 t 가 재현된다. dy 를 빼면 동심 = 배경 잔광 26장.
    //   동심으로 놨을 때 모루 아래가 최대 13 밝았다(실측).
    // ⚠ 알파는 **합이 아니라 곱**으로 쌓인다. ∫ 근사(a·[(1−r)−.175(1−r²)])는
    //   화로처럼 층 알파가 굵으면 중앙에서 .495 vs 실제 .393 으로 크게 빗나가고,
    //   가장자리에서는 층 수가 적어(ceil) 반대로 모자란다. 그래서 옛 스택의
    //   합성을 그대로 계산해 스톱으로 옮긴다 — 층 j 의 고른 구간 한가운데에 찍는다.
    // 탭이 숨으면 #hearth 가 0×0 이라 rx·ry 가 0 이 되고 k=0/0=NaN 이 된다 —
    // createRadialGradient 는 비유한값에 예외를 던진다(017 검증에서 pageerror 로
    // 잡혔다). 옛 fillEllipse 는 0 크기를 조용히 넘겼으므로 여기서 막는다.
    if(!(rx>0)||!(ry>0)) return;
    const k=ry/rx, off=(dy||0)/k;
    const gr=g.createRadialGradient(0,0,0, 0,off,rx);
    //   층 j..N 이 덮는 구간은 r∈((j−1)/N, j/N] 이므로 스톱은 그 **한가운데**에
    //   찍는다. (j+.5)/N 로 한 칸 밀었더니 전 구간이 10 밝게 나왔다(실측).
    for(let j=1;j<=N;j++){ let keep=1;
      for(let i=j;i<=N;i++) keep*=1-a/N*(1-.35*i/N);
      gr.addColorStop((j-.5)/N, rgba(C_HOT, 1-keep)); }
    g.save(); g.translate(cx,cy); g.scale(1,k);
    g.fillStyle=gr; g.beginPath(); g.arc(0,off,rx,0,Math.PI*2); g.fill();
    g.restore();
  }

  // 배경: 무쇠 두 겹 + 아래쪽 화로 잔광 (§1, body CSS 에서 008 이 이관한 것).
  function drawBg(){
    if(!bgCan) return;
    const w=CW, h=CH, g=bgCtx;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,w,h);
    // 위쪽은 무쇠(푸른 기), 아래로 내려가며 숯(갈색 기)으로 넘어간다.
    g.fillStyle=hex(C_CHAR); g.fillRect(0,0,w,h);
    const lg=g.createLinearGradient(0,0,0,h*.62);
    lg.addColorStop(0,hex(C_IRON)); lg.addColorStop(1,hex(C_CHAR));
    g.fillStyle=lg; g.fillRect(0,0,w,h*.62);
    glow(g, w*.5, h*1.06, w*1.25*.68, h*.52*.68, .15, 26);   // ← 옛 타원 26장
    VIEW.perf.bgBakes++;
  }

  // 가운데 패널 바탕 + 화로 창 + 모루 (§2). 패널 크기 그대로 굽는다 —
  // 화면 크기로 잡으면 프레임마다 화면 한 장을 더 칠하게 된다(009 실측).
  function bakePanel(){
    const w=Math.max(1,Math.ceil(rF.w)), h=Math.max(1,Math.ceil(rF.h));
    if(!pnCan){ pnCan=document.createElement('canvas'); pnCtx=pnCan.getContext('2d'); }
    sizeCan(pnCan,w,h);
    const g=pnCtx, ox=rF.x, oy=rF.y;      // 오프스크린 안은 패널 좌상단 기준 좌표
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,w,h);
    const lg=g.createLinearGradient(0,0,0,rF.h);
    lg.addColorStop(0,hex(C_IRON)); lg.addColorStop(1,hex(C_CHAR));
    g.fillStyle=lg; g.fillRect(0,0,rF.w,rF.h);
    if(rH){
      const hx=rH.x-ox, hy=rH.y-oy, cx=hx+rH.w/2, base=hy+rH.h;
      /* 047 §2③ — 숯·잔광이 화로 창이 아니라 **장면 전체**에 깔린다(`rH` = 장면). */
      g.fillStyle=hex(C_CHAR); g.fillRect(hx,hy,rH.w,rH.h);
      glow(g, cx, base, rH.w*.46, rH.h*.525, .6, 12, -rH.h*.08);  // ← 옛 타원 12장
      /* 047 §2③ — 모루를 **키운다**: 폭 `min(장면 폭 × 0.55, 300px)`, 장면 바닥
         가운데. 새 그림·새 색은 없다(R5 몫) — 같은 도형을 크게 그릴 뿐이다.
         ⚠ `rH` 는 이제 **장면(`#forge`)** 이다(sync 참고). 옛 `rH` 는 화로 창이라
           모루가 그 안에 갇혀 작았다. */
      const aw=Math.min(rH.w*.55,300), ah=Math.max(20,Math.min(rH.h*.22,86));
      const ay=base-6, T=ay-ah, L=cx-aw/2, R=cx+aw/2;
      VIEW.anvil={x:ox+cx, y:oy+T};                            // 연출 발원점(화면 좌표)
      /* ⚠ 몸통·받침을 숯(`C_CHAR`)으로 칠하면 **안 보인다** — 옛 모루는 밝은 화로
         창 «안»에 있어서 숯 실루엣이 읽혔는데, 047 은 장면 바닥(역시 숯)에 앉는다.
         화면으로 확인했다(모루가 상판 한 줄로만 보였다). 철색으로 올린다 —
         새 색을 만들지 않고 이미 쓰는 `C_IRON` 을 어둡게 깐 것이다. */
      g.fillStyle=rgba(C_IRON,.72);
      g.fillRect(cx-aw*.19, T+ah*.34, aw*.38, ah*.52);         // 몸통
      g.fillRect(cx-aw*.30, ay-ah*.16, aw*.60, ah*.16);        // 받침
      g.fillStyle=hex(C_IRON);
      g.fillRect(L, T, aw, ah*.30);                            // 상판
      g.beginPath(); g.moveTo(R,T);                            // 뿔
      g.lineTo(R+aw*.16, T+ah*.15); g.lineTo(R, T+ah*.30); g.closePath(); g.fill();
      // 윗면은 새 회색을 만들지 않고 화로 불빛을 받게 한다 (알파로만 밝힌다)
      g.fillStyle=rgba(C_HOT,.35); g.fillRect(L, T, aw, ah*.07);
    } else VIEW.anvil=null;
    VIEW.perf.panelBakes++;
  }


  /* ══ 전투 무대 (013) ══════════════════════════════════════════════
     "모험을 떠난다"를 만드는 자리다. 규칙은 ART-DIRECTION 「전투 무대」 그대로:

     ① **평소에는 멈춰 있다.** 웨이브를 클리어하는 순간에만 배경이 옆으로 흐른다.
        상시 스크롤은 011 의 절전을 통째로 무효로 만든다 — 방치형에서 배터리는
        곧 체류 시간이다. 그래서 이동은 사건(웨이브 전환) 하나에만 붙는다.
     ② **3층 패럴랙스**를 소수의 타일 반복으로 만든다 (손그림 12장).
     ③ **구간은 팔레트 스왑**이다. 지형을 새로 그리지 않는다.

     층마다 **한 장씩 구워 두고**(009·011 규약) 프레임당 drawImage 세 번으로 끝낸다.
     띠 너비를 「무대 폭 + 4타일」로 잡는 이유: 네 장이 한 주기라 4타일마다 무늬가
     반복되므로, 그만큼 여유를 두면 **스크롤이 아무리 진행돼도 다시 굽지 않는다.** */
  const STAGE_PARA=[0.25, 0.55, 1.00];    // 먼 산이 가장 느리다
  const TRAVEL_MS=420, TRAVEL_PX=176;     // 짧고 분명하게 (길면 방치 시간을 이동이 먹는다)
  const STAGE_KEYS=['far','mid','near'];
  let rA=null;                            // #arena 사각형
  let stLay=[], stScale=0, stSeg=-1, stW=0, stH=0, stGround=0;
  let scrollX=0, travFrom=0, travTo=0, travUntil=0;
  const foeCan={};                        // 구간·배율당 몹·용사 캔버스 한 벌

  // 스프라이트의 실제 바닥 행 — 발을 지면선에 맞추려면 이것이 필요하다.
  function lastRow(px,W,H){
    for(let y=H-1;y>=0;y--) for(let x=0;x<W;x++)
      if(px.charCodeAt(y*W+x)!==46) return y;
    return H-1;
  }
  function foeSprite(kind,tier,ms,seg,white){
    const k=kind+'|'+tier+'|'+ms+(white?'|w':'');
    if(foeCan[k]) return foeCan[k];
    const px = kind==='hero' ? SPR_HERO : kind==='heroAtk' ? SPR_HERO_ATK
             : (SPR_MOB[kind]||SPR_MOB.melee)[tier-1];
    // 번쩍임(018)은 같은 그림을 **백열 한 색으로** 구운 판이다 — 프레임을 그리지
    // 않는다는 규약 그대로고, 팔레트만 갈아 끼우면 되므로 한 장도 늘지 않는다.
    const P = white ? [null,HOT_WHITE,HOT_WHITE,HOT_WHITE,HOT_WHITE]
            : (kind==='hero'||kind==='heroAtk') ? heroPalette(seg) : mobPalette(seg);
    const cv=document.createElement('canvas');
    cv.width=SPR_UNIT*ms; cv.height=SPR_UNIT*ms;
    if(!paintPX(cv.getContext('2d'),px,SPR_SIZE,SPR_SIZE,P,ms*SPR_FIT,0,0)) return null;
    cv.__bot=lastRow(px,SPR_SIZE,SPR_SIZE);   // **칸** 인덱스다 — 화면으로 옮길 때 SPR_FIT 을 곱한다
    return (foeCan[k]=cv);
  }
  // 무기 궤적은 **012 의 장비 스프라이트를 그대로 태운다**(ART-DIRECTION).
  // 등급이 오르면 궤적의 그림이 바뀌므로 장비를 바꾼 보람이 전투에서 보인다.
  function weaponSprite(g,ms){
    const k='wpn|'+(g|0)+'|'+ms;
    if(foeCan[k]) return foeCan[k];
    const px=SPR.weapon[(g?TIER(g):2)-1];
    const cv=document.createElement('canvas');
    cv.width=SPR_UNIT*ms; cv.height=SPR_UNIT*ms;
    if(!paintPX(cv.getContext('2d'),px,SPR_SIZE,SPR_SIZE,gradePalette(g),ms*SPR_FIT,0,0)) return null;
    return (foeCan[k]=cv);
  }

  /* ══ 전투 모션 (018) ══════════════════════════════════════════════
     ART-DIRECTION 「전투 모션」: **타격감은 프레임 수가 아니라 타이밍에서 나온다.**
       ① 예비-타격-복귀 — 예비는 길게, 타격은 짧게, 복귀는 천천히. translate 뿐이다.
       ② hitstop      — 맞는 순간 양쪽을 **완전히 멈춘다**. 더하는 게 아니라 빼는 기법.
       ③ 번쩍임        — 백열 한 색으로 구운 같은 그림을 2프레임 얹는다.
       ④ 소멸          — 그림이 아니다. 위로 튀었다 아래로 꺼지며 불티가 흩어진다.
     넷 다 `__view.counters` 에 나온다. 추가 손그림은 용사 공격 포즈 1장뿐이다. */
  const ATK_WIND=150, ATK_HIT=70, ATK_BACK=180;   // 예비 · 타격 · 복귀
  const ATK_LAND=ATK_WIND+ATK_HIT, ATK_ALL=ATK_LAND+ATK_BACK;
  const ATK_PULL=6, ATK_PUSH=13;                  // 셀 단위 (배율을 곱한다)
  const HITSTOP_MS=50;      // 3프레임
  const FLASH_MS=34;        // 2프레임
  const DIE_MS=320;
  const DIE_LOG=32;         // `motion.dieOrder` 상한 — 검증 창구지 로그가 아니다
  // §3 개체 간격 — 고정 픽셀이 아니라 **무대 폭에서 파생**한다.
  const STAGE_X0=0.27, STAGE_SPAN=0.72, MOB_GAP=0.14;
  const MOB_INK=0.88;       // 스프라이트 24칸 중 실제로 칠해진 폭의 비율(경계상자)
  let atkT=-1, atkGrade=0, atkLanded=false;
  let stopUntil=0, flashUntil=0;
  const dying=[];           // {slot,kind,tier,t}

  /* ⚠ 개체 수가 곧 남은 체력이다 (DESIGN.md: 전체 체력 / 개체 수). 붙어서 하나로
     보이면 그 정보가 죽는다 — 013 검증이 「근접 9마리가 뭉쳤다」고 지적한 자리다.
     간격을 고정 픽셀로 주면 마리 수가 바뀔 때 다시 뭉치므로 무대 폭에서 파생하고,
     폭이 모자라면 **배율을 한 단계 낮춘다**(배율은 정수여야 한다 — 012). */
  function mobLayout(){
    const n=foeCount|0;
    const span=rA.w*STAGE_SPAN;
    // 필요한 폭은 **칸 폭이 아니라 잉크 폭**으로 잰다. 스프라이트는 24칸 중 21칸만
    // 칠해져 있어(경계상자) 칸으로 재면 필요 이상으로 배율을 낮춘다 — 처음에 그렇게
    // 잡았더니 380 에서 5마리일 때도 배율 1 로 떨어졌다.
    const need=m=>{ const ink=SPR_UNIT*m*MOB_INK;
      return (n-1)*(ink+Math.max(3,ink*MOB_GAP)) + SPR_UNIT*m; };
    let ms=Math.max(1,stScale-1);
    while(ms>1 && need(ms) > span) ms--;
    const step=n>1 ? (span-SPR_UNIT*ms)/(n-1) : 0;
    return {n, ms, x0:rA.x+rA.w*STAGE_X0, step, gap:step-SPR_UNIT*ms*MOB_INK};
  }
  const heroDX=ms=>{
    if(atkT<0) return 0;
    // reduced-motion 에서는 예비·복귀를 줄인다 (008 규칙 유지).
    if(VIEW.reducedMotion)
      return atkT<ATK_LAND ? 0 : ATK_PUSH*ms*.5*(1-Math.min(1,(atkT-ATK_LAND)/ATK_BACK));
    if(atkT<ATK_WIND) return -ATK_PULL*ms*ezOut(atkT/ATK_WIND);          // 예비: 천천히 뒤로
    if(atkT<ATK_LAND){ const t=(atkT-ATK_WIND)/ATK_HIT;                   // 타격: 빠르게 앞으로
      return -ATK_PULL*ms + (ATK_PULL+ATK_PUSH)*ms*t*t; }
    return ATK_PUSH*ms*(1-ezOut((atkT-ATK_LAND)/ATK_BACK));               // 복귀: 천천히
  };
  function stepMotion(dt){
    // hitstop — **무대의 시간이 흐르지 않는다.** 용사도 몹도 소멸도 그 자리에 선다.
    if(nowMs()<stopUntil) return;
    if(atkT>=0){
      atkT+=dt;
      if(!atkLanded && atkT>=ATK_LAND){        // 궤적이 닿는 순간
        atkLanded=true;
        if(!VIEW.reducedMotion){ stopUntil=nowMs()+HITSTOP_MS; VIEW.counters.hitstop++; }
        flashUntil=nowMs()+(VIEW.reducedMotion?FLASH_MS:HITSTOP_MS+FLASH_MS);
        VIEW.counters.flash++;
      }
      if(atkT>=ATK_ALL){ atkT=-1; atkLanded=false; }
    }
    for(let i=dying.length-1;i>=0;i--){ dying[i].t+=dt; if(dying[i].t>=DIE_MS) dying.splice(i,1); }
  }
  // 개체 하나가 사라지는 순간 (CORE 의 체력 계산은 건드리지 않는다 — 소멸 시점은
  // drawFoes 가 이미 정한 그대로다). 008 의 불티 예산 안에서 몇 알만 흩는다.
  // 019 §2: **슬롯 배열을 받는다.** 같은 틱에 죽은 것들은 한 다발이다 — 깨움 창도
  // 불티 예산도 한 번만 선다. 숫자 하나로 부르던 옛 호출도 그대로 받는다.
  globalThis.__foeDie=slots=>{
    if(!rA || !stLay.length) return;
    if(hidden()){ VIEW.perf.hiddenSkips++; return; }   // 안 보이는 소멸은 그리지 않는다
    const list=Array.isArray(slots)?slots:[slots];
    if(!list.length) return;
    const L=mobLayout(), ground=rA.y+stGround;
    const tier=Math.max(1,Math.min(3,1+Math.floor((S.wave-1)/25)));
    // 불티는 **다발 전체의 예산**을 나눠 쓴다. 마리마다 6알이면 9마리에서 54알이
    // 되어 앞 겹이 그만큼 오래 살아 있는다 — 자리는 마리마다 지키되 알 수를 나눈다.
    const budget=VIEW.reducedMotion?2:Math.min(12, 5+list.length);
    const per=Math.max(1, Math.round(budget/list.length));
    for(const slot of list){
      const kind = foeKind==='mix' ? (slot%2?'ranged':'melee') : foeKind;
      dying.push({slot, kind, tier, t:0});
      VIEW.counters.dissolve++;
      // 021 — **소멸 순서를 검증 창구에 낸다.** 이 값이 없어서 101개 검사 중
      // 아무도 「먼 쪽부터 죽는다」를 못 잡았다. 길이는 묶어 둔다(누수 금지).
      VIEW.motion.dieOrder.push(slot);
      if(VIEW.motion.dieOrder.length>DIE_LOG) VIEW.motion.dieOrder.shift();
      emit(per, L.x0+L.step*slot+SPR_UNIT*L.ms/2, ground-8*L.ms, .45);   // 짧게 사는 불티
    }
    // 깨우는 창은 **실제로 도는 시간에 맞춘다.** 처음에 앞 겹을 1,220ms 깨웠더니
    // 유휴 가동률이 앞 겹만 35.6% 로 뛰었다(불티는 320ms 면 다 꺼진다).
    canvasWake(DIE_MS+80, DIE_MS+90);
  };
  function bakeStage(){
    stLay=[];
    if(!rA || rA.w<8 || rA.h<8) return;
    // 배율은 정수다 (012 규약 — 소수 배율은 픽셀을 뭉갠다).
    const s=Math.max(1,Math.min(3,Math.floor(rA.h/26)));
    const seg=segOf(S.wave), w=Math.ceil(rA.w)+TILE_W*4*s, h=TILE_H*s;
    const G=Math.round(rA.h-8*s);        // 지면선 — 근경 흙 두께가 8행이다
    for(let i=0;i<3;i++){
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d'), P=stagePalette(seg,i);
      const tiles=SPR_TILE[STAGE_KEYS[i]], tw=TILE_W*s;
      for(let t=0; t*tw<w; t++) paintPX(cx,tiles[t%4],TILE_W,TILE_H,P,s,t*tw,0);
      // 층의 지평선이 위에서부터 먼 산 → 중경 → 근경 순으로 내려와야 원근이 산다.
      // 각 층 타일의 「가장자리 높이」(먼 17행 · 중경 15행 · 근경 16행)를 기준으로
      // 지면선 G 에서 거꾸로 올려 놓는다. 처음에 0.30h 로 잡았더니 중경 지평선이
      // 근경보다 **아래**로 내려가 원근이 뒤집혔다.
      stLay.push({can:cv, para:STAGE_PARA[i], per:tw*4,
        y: i===0 ? G-17*s-8*s : i===1 ? G-15*s-3*s : G-16*s});
    }
    // 몹·용사 캐시는 **구간·배율당 한 벌**이다. 구간이 바뀌면 통째로 비운다 —
    // 안 비우면 웨이브가 오를수록 캔버스가 쌓인다(soak.js 가 보는 누수).
    if(seg!==stSeg || s!==stScale) for(const k in foeCan) delete foeCan[k];
    stScale=s; stSeg=seg; stW=Math.ceil(rA.w); stH=Math.ceil(rA.h);
    // 근경 타일의 윗면은 16행이다 (SPR_TILE 주석) — 거기가 지면선이다.
    stGround = stLay[2].y + 16*s;   // = G
    VIEW.perf.bgBakes++;    // 무대 띠도 배경 오프스크린이다 — P2 가 방치 중 재굽기를 잡는다
  }
  // 이동은 웨이브 전환 사건에만 붙는다. 진행은 프레임에서 시간으로 푼다.
  function stepTravel(){
    if(!travUntil) return;
    const left=travUntil-nowMs();
    if(left<=0){ scrollX=travTo; travUntil=0; return; }
    scrollX = travFrom + (travTo-travFrom)*ezOut(1-left/TRAVEL_MS);
  }
  function drawArena(g){
    if(!rA || !stLay.length) return;
    g.save();
    g.beginPath(); g.rect(rA.x,rA.y,rA.w,rA.h); g.clip();
    for(const L of stLay){
      const off=((scrollX*L.para)%L.per+L.per)%L.per;   // 4타일 주기로 되감는다
      g.drawImage(L.can, Math.round(rA.x-off), Math.round(rA.y+L.y));
    }
    const L=mobLayout(), ms=L.ms, ground=rA.y+stGround;
    const now=nowMs(), stopping=now<stopUntil, flashing=now<flashUntil;
    // ── 용사: 그림 두 장(대기·공격)과 translate 뿐이다 (018) ──
    // 등급·부위는 여전히 반영하지 않는다 — 반영하면 부위×단계×포즈로 손그림이
    // 폭발한다(ART-DIRECTION). 바뀌는 것은 자세와 **손에 실린 무기 그림**이다.
    const swinging = atkT>=ATK_WIND*0.6 && atkT<ATK_ALL;
    const hero=foeSprite(swinging?'heroAtk':'hero',1,ms,stSeg);
    const hx=rA.x+rA.w*0.05+heroDX(ms);
    if(hero) g.drawImage(hero, Math.round(hx), Math.round(ground-(hero.__bot+1)*ms*SPR_FIT));
    // ── 무기 궤적: 012 장비 스프라이트를 태운다. 잔상 3장, 회전 없음 ──
    // 회전시키면 픽셀이 보간돼 뭉갠다(ART-DIRECTION 안티에일리어싱 금지). 대신
    // 같은 그림을 호를 따라 몇 장 겹쳐 알파로 흘린다.
    const trail = atkT>=ATK_WIND && atkT<ATK_LAND+70;
    if(trail){
      const wg=(S.equip&&S.equip.weapon)?S.equip.weapon.g:0;
      const wv=weaponSprite(wg,ms);
      if(wv){
        const t=Math.min(1,(atkT-ATK_WIND)/(ATK_HIT+70));
        for(let k=0;k<3;k++){
          const u=Math.max(0,t-k*0.16);
          g.globalAlpha=Math.max(0,(1-k*0.3)*(1-t*0.85));
          g.drawImage(wv, Math.round(hx+(11+20*u)*ms),
                          Math.round(ground-(15+5*Math.sin(u*Math.PI))*ms));
        }
        g.globalAlpha=1;
      }
    }
    // ── 몹 — 개체 수·종류·생존은 전부 CORE 가 정한 값을 읽는다(이중 틱 금지) ──
    const n=L.n, alive=(n&&foeMax) ? Math.max(0,Math.min(n,Math.round(foeHP/foeMax*n))) : n;
    const tier=Math.max(1,Math.min(3,1+Math.floor((S.wave-1)/25)));
    const slide=Math.max(0, travTo-scrollX);          // 이동 중엔 오른쪽에서 들어온다
    const mobX=i=>L.x0+L.step*i+slide;
    const cut=deadCut(n,alive);
    for(let i=0;i<n;i++){
      if(i<cut) continue;                             // 처치된 개체는 사라진다 (001 규약)
                                                      // 021: 앞쪽(용사 쪽)부터 비워진다
      // 혼합 웨이브의 홀짝은 #mob 블록과 **같은 규칙**이다 — 둘이 어긋나면 안 된다.
      const kind = foeKind==='mix' ? (i%2?'ranged':'melee') : foeKind;
      // 번쩍임은 맨 앞(맞는) 개체에만. 같은 그림의 백열 판이라 손그림이 안 는다.
      // ⚠ **맨 앞 = 인덱스 0 이 아니라 «살아 있는 가장 왼쪽»(= `cut`, `stage.nearest`)다.**
      //   021 이 앞쪽부터 비우기 시작하면서 인덱스 0 이 빈칸이 됐고, 그대로 두면
      //   **허공이 번쩍인다** — 021 이 낸 회귀다. 018 의 의도는 처음부터 「맞는 개체는
      //   용사에게 가장 가까운 것」이었으므로 이 줄은 연출의 **변경이 아니라 복구**다.
      //   타이밍·지속시간·진폭(FLASH_MS·HITSTOP_MS·ATK_*)은 한 글자도 안 건드린다.
      const cv=foeSprite(kind,tier,ms,stSeg, flashing && i===cut); if(!cv) continue;
      g.drawImage(cv, Math.round(mobX(i)), Math.round(ground-(cv.__bot+1)*ms*SPR_FIT));
    }
    // ── 소멸: 위로 튀었다 아래로 꺼진다 (001 foedie 와 같은 규약) ──
    for(const d of dying){
      const cv=foeSprite(d.kind,d.tier,ms,stSeg); if(!cv) continue;
      const u=Math.min(1,d.t/DIE_MS);
      const rise=Math.sin(Math.min(1,u*1.7)*Math.PI)*9*ms, sink=u*u*7*ms, sc=1-0.32*u;
      g.globalAlpha=Math.max(0,1-u*u);
      g.drawImage(cv, Math.round(mobX(d.slot)+cv.width*(1-sc)/2),
                      Math.round(ground-(cv.__bot+1)*ms*SPR_FIT-rise+sink),
                      Math.round(cv.width*sc), Math.round(cv.height*sc));
      g.globalAlpha=1;
    }
    g.restore();
    VIEW.stage.scale=stScale; VIEW.stage.seg=stSeg; VIEW.stage.scrollX=Math.round(scrollX);
    VIEW.stage.moving=!!travUntil; VIEW.stage.mobs=n; VIEW.stage.alive=alive;
    VIEW.stage.kind=foeKind; VIEW.stage.tier=tier; VIEW.stage.hero=!!hero;
    VIEW.stage.ground=Math.round(stGround); VIEW.stage.rect=rA?{...rA}:null;
    // 배치를 그대로 낸다 — 검사가 좌표식을 박아 두면 배치가 바뀌는 순간 조용히
    // 엉뚱한 자리를 재게 된다(018 에서 ST2 가 실제로 그랬다).
    VIEW.stage.mobScale=ms; VIEW.stage.mobStep=Math.round(L.step);
    VIEW.stage.mobX0=Math.round(L.x0); VIEW.stage.gap=Math.round(L.gap);
    // 021 — 어디까지 비었는지. `deadCut` 앞쪽이 죽은 자리다(용사 쪽).
    VIEW.stage.deadCut=cut; VIEW.stage.nearest=cut<n?cut:-1;
    VIEW.motion.attacking=atkT>=0; VIEW.motion.hitstop=stopping;
    VIEW.motion.atkPhase = atkT<0 ? '' : atkT<ATK_WIND ? 'wind' : atkT<ATK_LAND ? 'hit' : 'back';
    VIEW.motion.flashing=flashing; VIEW.motion.dying=dying.length;
    VIEW.motion.pose=swinging?'attack':'idle'; VIEW.motion.trail=!!trail;
    VIEW.motion.reduced=!!VIEW.reducedMotion;
  }

  // 캔버스 크기 추적 (Phaser 의 Scale.RESIZE 자리). 부모가 position:fixed;inset:0
  // 이라 부모 크기 = 화면 크기다. 버퍼를 다시 잡으면 내용이 지워지므로 다시 굽는다.
  function fit(){
    const h=document.getElementById('stage'); if(!h||!L_BG) return;
    const w=Math.max(1,h.clientWidth|0), ht=Math.max(1,h.clientHeight|0);
    if(w===CW && ht===CH) return;
    CW=w; CH=ht;
    sizeCan(L_BG.el,w,ht); if(L_FX) sizeCan(L_FX.el,w,ht);
    VIEW.canvas={w:CW,h:CH};
    if(!bgCan){ bgCan=document.createElement('canvas'); bgCtx=bgCan.getContext('2d'); }
    sizeCan(bgCan,w,ht);
    drawBg();
    rF=rH=rV=null;                 // 패널을 그 크기로 다시 굽게 한다
    canvasWake(600);
  }

  function sync(){
    // 무대는 #hud 안이라 스크롤과 무관하다 — 크기·구간이 달라질 때만 다시 굽는다.
    const nA=rectOf('arena');
    if(nA && (!rA || !same(nA,rA) || segOf(S.wave)!==stSeg)){ rA=nA; bakeStage(); canvasWake(); }
    /* 047: 모루는 이제 **장면 전체**(`#forge`)에 앉는다. 옛 `rH` 는 화로 창이었고
       거기에 맞춰 모루가 작았다(§2③ 「모루를 키운다」). 장면 사각형을 넘긴다. */
    const nF=rectOf('scene'), nH=rectOf('forge'), nV=rectOf('scene');
    // 각 줄의 실제 치수를 검증 창구에 낸다 (캔버스는 Playwright 가 못 읽는다).
    const rHud=rectOf('hud'), rAr=rectOf('arena'), rOp=rectOf('openrow'), rDk=rectOf('dock');
    VIEW.layout.hud=rHud?Math.round(rHud.h):0;
    VIEW.layout.arena=rAr?Math.round(rAr.h):0;
    VIEW.layout.scene=nF?Math.round(nF.h):0;
    VIEW.layout.openrow=rOp?Math.round(rOp.h):0;
    VIEW.layout.dock=rDk?Math.round(rDk.h):0;
    try{ const se=document.scrollingElement||document.documentElement;
      VIEW.layout.scroll=Math.max(0,se.scrollHeight-se.clientHeight);
      VIEW.layout.orientation=(innerWidth>innerHeight)?'landscape':'portrait';
    }catch(e){}
    if(same(nF,rF)&&same(nH,rH)&&same(nV,rV)) return;
    canvasWake();                  // 기하가 움직였다 — 안정될 때까지 더 돈다
    rV=nV;
    const sizeSame = rF&&nF&&Math.abs(nF.w-rF.w)<.5&&Math.abs(nF.h-rF.h)<.5
                  && rH&&nH&&Math.abs(nH.w-rH.w)<.5&&Math.abs(nH.h-rH.h)<.5;
    const dx = sizeSame ? nF.x-rF.x : 0, dy = sizeSame ? nF.y-rF.y : 0;
    rF=nF; rH=nH;
    if(!rF){ VIEW.anvil=null; return; }
    // 스크롤 = 크기 그대로, 위치만 이동. **다시 굽지 않는다** — 그리는 좌표만
    // 달라지므로 Phaser 때의 setPosition·setCrop 두 호출조차 필요 없다.
    if(sizeSame){
      if(VIEW.anvil){ VIEW.anvil={x:VIEW.anvil.x+dx, y:VIEW.anvil.y+dy}; }
      VIEW.perf.moves++;
      return;
    }
    bakePanel();                   // 여기부터가 진짜 재굽기 — 크기가 바뀐 프레임에만
  }

  // 뒤 겹 합성: 배경 한 장 + 패널 한 장. 캔버스는 DOM 처럼 overflow 로 잘리지
  // 않으므로 중앙 창(#focus) 밖은 ctx.clip() 으로 잘라 낸다 (옛 setCrop 자리).
  function drawStage(){
    const g=L_BG&&L_BG.ctx; if(!g) return;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,CW,CH);
    g.save();
    if(nowMs()<shakeUntil)         // ① 카메라 셰이크 — 뒤 겹 전체가 흔들린다
      g.translate((Math.random()*2-1)*CW*shakeAmp, (Math.random()*2-1)*CH*shakeAmp);
    if(bgCan) g.drawImage(bgCan,0,0);
    stepTravel(); stepMotion(bgDT()); drawArena(g);   // 무대(013) + 모션(018)
    if(pnCan && rF && rF.w>=1 && rF.h>=1){
      g.save();
      if(rV){
        const top=Math.max(0, rV.y-rF.y), bot=Math.min(rF.h,(rV.y+rV.h)-rF.y);
        g.beginPath(); g.rect(rF.x, rF.y+top, rF.w, Math.max(0,bot-top)); g.clip();
      }
      g.drawImage(pnCan, rF.x, rF.y);
      g.restore();
    }
    g.restore();
  }

  /* ── 앞 겹: 불티 · 바운스 (DOM 위) ────────────────────────────────── */
  const P=[];                      // 불티. 상한은 §4 의 FX_MAX_PARTICLES.
  let bounce=null;                 // 획득 장비 하나. 겹치지 않게 항상 하나뿐이다.
  const ezOut=t=>1-(1-t)*(1-t);    // Quad.easeOut
  const B_UP=FX_BOUNCE_MS*.45;     // 올라가는 시간 (yoyo 라 내려오는 데 같은 시간)

  // lifeK: 수명 배수. 018 의 소멸 불티는 짧게 산다 — 불티가 오래 살수록 앞 겹을
  // 그만큼 오래 깨워 둬야 해서 유휴 가동률이 그대로 따라 오른다(실측 35.6%).
  function emit(n,x,y,lifeK){
    for(let i=0;i<n && P.length<FX_MAX_PARTICLES;i++){
      const ang=(200+Math.random()*140)*Math.PI/180, sp=40+Math.random()*170;
      P.push({x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        t:0, life:(280+Math.random()*440)*(lifeK||1),
        c:Math.random()<.5?C_WHITE:C_HOT});   // 백열은 정점 순간에만
    }
  }
  function stepFx(dt){
    const s=dt/1000;
    for(let i=P.length-1;i>=0;i--){ const p=P[i];
      p.t+=dt; if(p.t>=p.life){ P.splice(i,1); continue; }
      p.vy+=520*s; p.x+=p.vx*s; p.y+=p.vy*s;   // gravityY 520
    }
    if(bounce){ const b=bounce; b.t+=dt;
      if(b.red){ b.a=Math.max(0,1-b.t/180); b.off=0; if(b.t>=180) bounce=null; }
      else if(b.t<B_UP){        b.off=-b.dy*ezOut(b.t/B_UP); }
      else if(b.t<B_UP*2){      b.off=-b.dy*ezOut(1-(b.t-B_UP)/B_UP); }
      else { b.off=0; b.a=Math.max(0,1-(b.t-B_UP*2)/140); if(b.t>=B_UP*2+140) bounce=null; }
    }
  }
  function drawFx(){
    const g=L_FX&&L_FX.ctx; if(!g) return;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,CW,CH);
    if(bounce){                                   // 바운스가 아래, 불티가 위
      const b=bounce;
      g.globalAlpha=b.a; g.fillStyle=hex(b.col);
      g.beginPath();               // roundRect 가 없는 옛 브라우저는 각진 사각형으로
      if(g.roundRect) g.roundRect(b.x-7, b.y+b.off-7, 14, 14, 3);
      else g.rect(b.x-7, b.y+b.off-7, 14, 14);
      g.fill();
      g.globalAlpha=1;
    }
    g.globalCompositeOperation='lighter';         // blendMode:'ADD'
    for(const p of P){ const k=1-p.t/p.life;      // alpha 1→0 · scale .9→0
      g.globalAlpha=k; g.fillStyle=hex(p.c);
      g.beginPath(); g.arc(p.x, p.y, 3*.9*k, 0, Math.PI*2); g.fill();
    }
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
  }

  /* ══ 절전 (011 §1 · 017 에서 rAF 직접 제어로) ══════════════════════
     방치형은 화면을 몇 시간 켜 두는 물건이다. **바뀌지 않는 화면을 매 프레임
     다시 합성하는 것 자체가 설계 오류**고, 그 값은 배터리와 발열로 돌아온다.
     그래서 기본 상태가 잠든 것이고, 캔버스가 실제로 달라지는 사건에만 깨운다.

     루프가 자면 sync() 가 멈춘다 — 즉 **깨우는 자리를 빠뜨리면 캔버스가 어긋난
     채 멈춘다.** 그래서 깨우는 조건을 추측이 아니라 사건으로 못박는다:
       ① #forge·#hearth·#focus 의 **크기** → ResizeObserver
       ② #focus 의 **스크롤 위치**(패널이 움직이고 크롭이 바뀐다) → scroll
       ③ 창 크기 → resize
     여기에 연출(hitFx)과 사람의 입력을 더한다.
     **두 겹을 따로 재운다** — 뒤 겹에서 움직이는 것은 셰이크(150ms)뿐이고
     불티·바운스는 전부 앞 겹이다. 한 덩어리로 재우면 불티가 다 죽을 때까지
     뒤 겹까지 같이 돈다.
     ⚠ `__game`·`__gameFx` 의 `loop{running,wake,sleep}` 모양은 **계약이다** —
        checklist P1 이 바닥값을 재려고 이 셋을 직접 부른다. Phaser 를 걷어내도
        같은 모양을 유지한다(죽은 검사를 만들지 않는다). */
  const nowMs=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  /* 019 §2 — **안 보이는 화면의 연출은 값이 0이다.**
     방치형의 진짜 방치는 대개 탭이 뒤에 있는 상태다. 브라우저가 rAF 를 늦추기는
     하지만 **그것에 기대지 않는다** — 늦추는 정도는 브라우저·전원 상태마다 다르고,
     늦춰도 합성은 그대로 일어난다. 숨으면 두 겹을 재우고 깨우는 길을 막는다.
     ⚠ CORE 의 250ms 틱과 저장은 건드리지 않는다. 멈추는 것은 **그리는 일**뿐이다. */
  // 026: 019 의 술어를 **재사용**한다. 광고 중 무대 정지는 「탭이 숨은 것」과
  //      완전히 같은 처리라 새 경로를 만들 이유가 없다 — 두 겹 다 잠든다.
  const hidden=()=>(typeof document!=='undefined' && document.hidden===true)
                   || PLAT.paused===true;
  let wakeBgUntil=0, wakeFxUntil=0, lastFxT=0;
  function mkLoop(step){
    let id=0, running=false;
    const frame=()=>{ if(!running) return; id=requestAnimationFrame(frame); step(); };
    return { get running(){ return running; },
      wake(){ if(running) return; running=true; id=requestAnimationFrame(frame); },
      sleep(){ if(!running) return; running=false;
        if(id) cancelAnimationFrame(id); id=0; } };
  }
  let lastBgT=0;
  const bgDT=()=>{ const t=nowMs(), d=lastBgT?Math.min(64,t-lastBgT):16; lastBgT=t; return d; };
  function bgFrame(){
    // 루프가 돈다 = 살아 있다. 밖에서 loop.wake() 를 부른 경우(P1 이 그렇게 한다)
    // 여기서 깃발을 현실에 맞춘다 — 안 그러면 영영 다시 못 잔다.
    if(VIEW.perf.sleeping) VIEW.perf.sleeping=false;
    if(hidden()){ __game.loop.sleep(); markSlept(); lastBgT=0; return; }
    fit(); sync(); drawStage();
    VIEW.perf.frames++;                       // 013 §0 — 실제로 그린 프레임
    if(bgIdle()){ __game.loop.sleep(); markSlept(); lastBgT=0; }
  }
  function fxFrame(){
    if(VIEW.perf.sleeping) VIEW.perf.sleeping=false;
    if(hidden()){ __gameFx.loop.sleep(); markSlept(); lastFxT=0; return; }
    const t=nowMs(), dt=lastFxT?Math.min(64,t-lastFxT):16; lastFxT=t;
    // hitstop 은 **화면 전체**가 멈추는 것이다 — 불티만 계속 날면 멈춘 느낌이 깨진다.
    stepFx(t<stopUntil?0:dt); drawFx();
    VIEW.perf.framesFx++;                     // 013 §0
    VIEW.alive.particles=P.length;
    VIEW.alive.tweens=bounce?1:0;
    if(fxIdle()){ __gameFx.loop.sleep(); markSlept(); lastFxT=0; }
  }
  globalThis.__game  ={loop:mkLoop(bgFrame), engine:'canvas2d'};
  globalThis.__gameFx={loop:mkLoop(fxFrame), engine:'canvas2d'};

  function canvasWake(ms,fxMs){
    // 숨은 동안에는 **깨우는 길 자체가 막힌다.** 창을 쌓아 두지도 않는다 —
    // 돌아오는 순간 어차피 한 번 깨워 다시 그리므로 밀린 창은 값이 없다.
    if(hidden()){ VIEW.perf.hidden=true; VIEW.perf.hiddenSkips++; return; }
    const t=nowMs(), a=ms||SLEEP_IDLE_MS, b=(fxMs===undefined)?a:fxMs;
    wakeBgUntil=Math.max(wakeBgUntil,t+a); wakeFxUntil=Math.max(wakeFxUntil,t+b);
    if(VIEW.perf.sleeping){ VIEW.perf.sleeping=false; VIEW.perf.wakes++; }
    __game.loop.wake(); __gameFx.loop.wake();
  }
  // 도는 것이 있으면 안 재운다 — 자면 그 자리에서 얼어붙는다.
  const bgIdle=()=>nowMs()>=wakeBgUntil && nowMs()>=shakeUntil && !travUntil
    && atkT<0 && !dying.length && nowMs()>=stopUntil;   // 018 모션도 붙잡는다
  const fxIdle=()=>nowMs()>=wakeFxUntil && P.length===0 && !bounce;
  // `sleeping` 은 **둘 다 잠들었을 때**만 참이다 (검증이 "화면이 완전히 멈췄다"를
  // 이 한 값으로 읽을 수 있게).
  function markSlept(){
    const both=!__game.loop.running && !__gameFx.loop.running;
    if(both && !VIEW.perf.sleeping){ VIEW.perf.sleeping=true; VIEW.perf.sleeps++; }
  }
  globalThis.__canvasWake=canvasWake;     // 검증용 (지연 없이 깨는지 직접 부를 수 있게)

  /* ── 탭이 숨으면 접는다 / 돌아오면 한 번 깨운다 (019 §2) ──
     숨는 순간 **도는 것을 전부 버린다**: 이동은 끝점으로 스냅하고, 공격·소멸·
     불티·바운스는 버린다. 시간만 얼려 두면 돌아왔을 때 몇 분 전 동작이 이어져
     재생되는 꼴이 된다 — 안 보이는 동안 일어난 일은 연출로서 이미 끝난 것이다.
     ⚠ 이 자리는 CORE 의 `visibilitychange`(저장)와 **별개의 리스너**다. CORE 는
       손대지 않는다. */
  // ⚠ `document` 에 건다. visibilitychange 는 document 에서 나 window 로 **거슬러
  //    올라오는** 사건이라 둘 다 받지만, 나는 자리에 거는 쪽이 한 겹 덜 믿는다.
  document.addEventListener('visibilitychange',()=>{
    // 026: CrazyGames 는 「쉬는 동안」을 알고 싶어 한다. 탭이 숨으면 stop,
    //      돌아오면 start. 광고 쪽 start/stop 은 PLAT.rewarded() 가 따로 부른다.
    PLAT[document.hidden?'playStop':'playStart']();
    VIEW.perf.hidden=hidden();
    if(!hidden()){ canvasWake(600); return; }
    wakeBgUntil=0; wakeFxUntil=0; shakeUntil=0; stopUntil=0; flashUntil=0;
    atkT=-1; atkLanded=false; dying.length=0; P.length=0; bounce=null;
    VIEW.motion.dieOrder.length=0;               // 021 — 안 보이는 동안의 순서는 값이 없다
    if(travUntil){ scrollX=travTo; travUntil=0; }
    VIEW.alive.particles=0; VIEW.alive.tweens=0;
    __game.loop.sleep(); __gameFx.loop.sleep(); markSlept();
  });

  // 던전 보상 불티 (019 §1). **008 의 파티클을 그대로 쓴다** — 새 파티클 시스템을
  // 만들지 않는다. 상한도 008 것 그대로다(1회 분출 상한 · 동시 생존 상한).
  globalThis.__fxBurst=(n,x,y,lifeK)=>{
    if(hidden()){ VIEW.perf.hiddenSkips++; return 0; }
    const m=Math.max(1,Math.min(FX_BURST_CAP, n|0));
    emit(m,x,y,lifeK); VIEW.lastBurst=m; VIEW.counters.burst++;
    canvasWake(SLEEP_IDLE_MS, 900);
    return m;
  };

  /* 047 §2⑤-1 — 매 타의 짧은 셰이크. **기존 셰이크를 그대로 꺼내 쓴다**(새 연출
     금지 · R2 몫): `hitFx` 가 쓰는 `shakeUntil`/`shakeAmp` 와 같은 둘이고,
     세기만 정렬 연출보다 약하게 잡는다. 0 을 주면 아무 일도 안 한다(reducedMotion). */
  /* 047 §2⑤-5 — 미뤄 둔 정렬 연출을 마무리가 꺼내 쓸 수 있게 내보낸다.
     `hitFx` 자체는 이 IIFE 안이라 바깥에서 안 보인다. */
  globalThis.__hitFx=(hits,grade)=>hitFx(hits,grade);
  globalThis.__shake=(k)=>{
    if(hidden()){ VIEW.perf.hiddenSkips++; return 0; }
    const q=Math.max(0,Math.min(10,k|0)); if(!q) return 0;
    shakeUntil=nowMs()+FX_SHAKE_MS;
    shakeAmp=FX_SHAKE_MIN*(q/3);
    VIEW.counters.shake++;
    canvasWake(FX_SHAKE_MS+120, 900);
    return q;
  };

  // 깨우는 자리들. 전부 수동적이라 자는 동안에도 살아 있다.
  if(typeof ResizeObserver!=='undefined'){
    const ro=new ResizeObserver(()=>canvasWake());
    ['forge','hearth','scene'].forEach(id=>{
      const e=document.getElementById(id); if(e) ro.observe(e); });
  }
  ['focus','manage'].forEach(id=>{
    const e=document.getElementById(id);
    if(e) e.addEventListener('scroll',()=>canvasWake(),{passive:true});
  });
  addEventListener('scroll',()=>canvasWake(),{passive:true});
  addEventListener('resize',()=>canvasWake(600));
  // 사람이 만지면 무조건 깬다 (입력 지연 0). 실제로 캔버스가 안 바뀌면
  // SLEEP_IDLE_MS 뒤에 도로 잠든다.
  ['pointerdown','keydown','wheel','touchstart'].forEach(t=>
    addEventListener(t,()=>canvasWake(),{passive:true}));

  /* ── 타격 연출 3종 (§3) ── */
  function hitFx(hits,grade){
    // 019 §2 — 숨은 탭에서는 연출을 아예 시작하지 않는다. 자동 제련은 뒤에서도
    // 계속 돌지만(CORE 틱), 그 정렬의 셰이크·불티·모션은 아무도 보지 않는다.
    if(hidden()){ VIEW.perf.hiddenSkips++; return; }
    // 뒤 겹은 셰이크(150ms)만 돌면 되고, 앞 겹은 바운스(380ms)와 불티(수명 최대
    // 720ms)를 끝내야 한다. 이 뒤에도 살아 있는 것이 있으면 fxIdle() 이 붙잡는다.
    canvasWake(FX_SHAKE_MS+200, 1200);
    const red=VIEW.reducedMotion, an=VIEW.anvil;
    const power=Math.min(1,(hits-2)/3*.6 + Math.min(grade,15)/15*.4);

    // ① 카메라 셰이크 — 뒤 겹(모루·화로·배경)이 흔들린다. reduced 면 걸지 않는다.
    if(!red){
      shakeUntil=nowMs()+FX_SHAKE_MS;
      shakeAmp=FX_SHAKE_MIN+(FX_SHAKE_MAX-FX_SHAKE_MIN)*power;
      VIEW.counters.shake++;
    }
    if(!an) return;

    // ② 불티 — 상한 두 겹: 1회 분출 상한과 동시 생존 상한(emit 안)
    let n = red ? FX_BURST_REDUCED
                : Math.round(FX_BURST_BASE + (hits-2)*FX_BURST_PER_HIT + grade*FX_BURST_PER_G);
    n = Math.max(1, Math.min(FX_BURST_CAP, n));
    emit(n, an.x, an.y);
    VIEW.lastBurst=n; VIEW.counters.burst++;

    // ③ 전투 모션 (018) — 정렬이 곧 한 방이다. 예비-타격-복귀가 여기서 시작하고,
    //    닿는 순간 stepMotion 이 hitstop 과 번쩍임을 건다.
    atkT=0; atkLanded=false; atkGrade=grade;
    VIEW.counters.attack++;

    // ③ 바운스 — 획득 장비가 모루에서 튀어오른다. 하나만 두고 덮어써
    //    누적되지 않게 한다(옛 killTweensOf 자리).
    bounce={x:an.x, y:an.y, off:0, a:1, t:0, red,
      col: grade>=11?C_WHITE : grade>=6?C_BRASS : C_IRON,
      dy: 38+18*power};
    VIEW.counters.bounce++;
  }
  globalThis.__hitFx=hitFx;            // 검증용 (checklist·임시 스크립트가 직접 부른다)

  /* ── 부팅 ── */
  VIEW.scene='forge'; VIEW.sceneFx='fx'; VIEW.background='canvas';
  const fEl=document.getElementById('forge');
  VIEW.overlay={visible:!!fEl&&getComputedStyle(fEl).display!=='none'};
  fit(); sync();
  VIEW.ready=true;
  canvasWake();

  /* ── 웨이브 전환 감지 (013) ──
     newWave() 는 CORE 라 손댈 수 없다. 대신 그것이 매번 다시 쓰는 #foes 라벨을
     본다 — 008 의 `.reel` 클래스 관찰과 같은 종류의 이음매다. 첫 newWave() 는
     이 블록보다 먼저 돌므로 부팅에서는 이동이 걸리지 않는다. */
  const foesEl=document.getElementById('foes');
  if(foesEl && typeof MutationObserver!=='undefined'){
    let lastFoes=foesEl.textContent;
    new MutationObserver(()=>{
      const t=foesEl.textContent;
      if(t===lastFoes) return; lastFoes=t;
      dying.length=0;                              // 옛 배치의 소멸 잔상은 버린다 (018)
      // ⚠ 생존 기준선도 함께 리셋한다. 안 하면 새 웨이브의 개체 수가 옛 값보다
      //   적을 때 **소멸이 헛돌거나 빠진다** (018 검증에서 9→5 인데 2번만 돌았다).
      lastAlive=-1;
      travFrom=scrollX; travTo=scrollX+TRAVEL_PX; travUntil=nowMs()+TRAVEL_MS;
      if(segOf(S.wave)!==stSeg) bakeStage();      // 구간이 바뀌면 팔레트를 갈아 끼운다
      canvasWake(TRAVEL_MS+240);
    }).observe(foesEl,{childList:true,characterData:true,subtree:true});
  }

  // ── 정렬 순간 감지 (CORE 를 건드리지 않는 유일한 이음매) ──
  // spin() 은 CORE 라 손댈 수 없다. 대신 CORE 가 릴에 붙이는 .spin/.hit 클래스를
  // 본다. MutationObserver 콜백은 스핀 콜백이 **끝난 뒤** 한 번만 돌아서
  // (같은 태스크의 변경이 한 콜백으로 묶인다) 그때는 S.queue 까지 갱신돼 있다.
  const reels=document.getElementById('reels');
  if(reels && typeof MutationObserver!=='undefined'){
    let qAtSpin=0;
    /* 047 3차 ① — `attributeOldValue` 를 켠다. 옛 감시는 「지금 `hit` 이 있는가」로
       봤는데, 그러면 **이미 `hit` 인 칸에 다른 클래스가 붙기만 해도** 정렬로 읽는다.
       마무리에서 `fgPaint()` 가 `.echo`(이은 고리)를 붙이는 순간이 정확히 그것이라
       연출이 **두 번** 났다(검증 K5b: attack·bounce 0→2). `hit` 이 **새로 붙은**
       변화에만 반응한다 — 041 부터 있던 「결과가 남은 동안 고정/해제하면 연출이
       한 번 더」도 같은 원인이라 같이 사라진다. */
    new MutationObserver(muts=>{
      let started=false, hit=false;
      for(const m of muts){ const c=m.target.classList; if(!c) continue;
        const had=/(^|\s)hit(\s|$)/.test(m.oldValue||'');
        if(c.contains('spin')) started=true;
        if(c.contains('hit') && !had) hit=true; }
      if(started) qAtSpin=S.queue.length;          // 스핀 시작: 대기열 길이 기억
      if(!hit) return;
      const hits=document.querySelectorAll('.reel.hit').length;
      if(hits<2) return;                           // 정렬 실패는 연출 없음
      /* 047 §2⑤-5 — **정착이 아니라 «드러남» 에 묶는다.** CORE 는 420ms 뒤
         (=첫 타 직후) `.reel.hit` 를 다는데, 그때 터뜨리면 아직 두 번 더 쳐야 할
         결과가 첫 타에서 새어 나간다(검사 K5). 가려져 있으면 **미뤄 두었다가**
         마무리가 꺼낸다. 가림막이 없는 판(가려지지 않은 경로)에서는 예전 그대로. */
      const g = S.queue.length>qAtSpin ? (S.queue[S.queue.length-1].g||0) : 0;
      if(FG.veiled){ fgPending={hits,g}; return; }
      hitFx(hits,g);
    }).observe(reels,{subtree:true,attributes:true,attributeFilter:['class'],attributeOldValue:true});
  }
}

/* ═══════════════════════════════════════════════════════════════════
   === CORE (자체 점검) ===
   실행 순서 때문에 파일 끝에 둔다 — 점검이 foeCount 등 부팅 이후에야
   채워지는 값을 읽기 때문이다. 위치만 VIEW 뒤일 뿐 내용은 CORE 다.
   ═══════════════════════════════════════════════════════════════════ */
/* ══ 자체 점검 ══ */
(function(){
  // 점검은 S 를 임시로 헤집는다 (등급·별·테크를 바꿔 가며 공식을 확인). 진입 시
  // 얕은 복사를 떠 두고 끝날 때 통째로 되돌린다 — 예전엔 S.peak·S.tech 가 복원
  // 없이 0·{} 로 남아, 페이지를 열 때마다 복귀 유저의 테크트리와 승천 관문
  // 진행도가 통째로 사라지고 250ms 뒤 save() 가 그걸 덮어썼다.
  // 얕은 복사면 충분하다: 점검은 객체 속을 고치지 않고 참조만 갈아끼운다.
  const snap={...S};
  const p=gradeProbs(0), s=p.reduce((a,c)=>a+c,0);
  console.assert(Math.abs(s-1)<1e-9,'확률 합 != 1');
  console.assert(p[0]>=0.0999,'1등급 하한 깨짐');
  console.assert(gradeProbs(2)[cap()-1]>gradeProbs(0)[cap()-1],'정렬 보너스 무효');
  const it=makeItem('head',8);
  console.assert(Object.keys(it.ops).length===3,'8등급 3줄 아님');
  console.assert(!('melee' in makeItem('head',8).ops),'방어구에 무기 옵션');
  console.assert(Array.from({length:3000},rollLv).every(v=>v>=1&&v<=10),'세부등급 범위 이탈');
  console.assert(p.length===GMAX,'등급 수 불일치');
  // 초기 조건 검사는 현재 세이브가 아니라 newState() 의 상수 기본값으로 돌린다.
  // (복귀 유저 환경에서 self-check 가 통째로 실패하던 원인)
  const D=newState();
  const onDefaults=f=>{ const l=S.lv,s2=S.star; S.lv=D.lv; S.star=D.star;
    const r=f(); S.lv=l; S.star=s2; return r; };
  console.assert(onDefaults(cap)===5,'초기 상한이 5가 아님');
  console.assert(gradeProbs(2).slice(cap()).every(v=>v===0),'상한 밖 등급이 뽑힘');
  console.assert(lines(15)===4&&lines(10)===3&&lines(6)===2&&lines(2)===1,'옵션 줄 수 오류');
  console.assert(ROMAN.length===11&&LVW.length===10,'세부등급 10단계 아님');
  console.assert(Math.abs(lvProbs().reduce((a,x)=>a+x,0)-1)<1e-9,'세부등급 확률 합 오류');
  const sv=S.lv; S.lv=40;
  console.assert(lvProbs()[9]>lvProbs.call(null)[0]*0||true,'');
  const hi=lvProbs()[9]; S.lv=0;
  console.assert(hi>lvProbs()[9],'제련 강화가 세부등급을 못 밀음');
  S.lv=capLvMax();
  const a=gradeProbs(0)[GMAX-1]; S.lv=capLvMax()+30;
  console.assert(Math.abs(gradeProbs(0)[GMAX-1]-a)<1e-12,'상한 개방 후에도 등급 확률이 계속 오름');
  S.peak=ASC_WAVE(); console.assert(canAscend(),'승천 조건 미충족'); S.peak=0;
  S.lv=sv;
  const svS=S.star, svL=S.lv; S.star=3; S.lv=0;
  console.assert(cap()===5,'승천 후 시작 상한이 5가 아님');
  console.assert(ASC_LV()===28&&capLvMax()===20,'승천 문턱이 별에 따라 변함');
  console.assert(starMul()===64&&Math.abs(optMul()-2.8)<1e-9,'승천 배율 오류');
  console.assert(qmax()===13,'승천 대기창 증가 안 됨');
  S.lv=28; console.assert(qmax()===17,'제련 대기창 증가 안 됨');
  S.star=svS; S.lv=svL;
  console.assert(onDefaults(qmax)===10,'초기 대기창이 10칸이 아님');
  // 테크트리 / 층 / 주사위
  console.assert(Object.keys(TECH).length===6,'테크 항목 수 오류');
  // 기준선은 현재 세이브가 아니라 테크 0 이다 (newState().tech). 고테크 세이브는
  // 이미 하한(1500ms)·상한(cap)·바닥(-50%)에 붙어 있어서, 현재값을 기준으로
  // 삼으면 포화가 곧 실패로 뒤집힌다 — spd 94 부터 CHG_MS 가 안 줄어든다.
  // 포화는 정상 동작이지 결함이 아니므로, 검사는 0 대 만렙으로 잰다 (005).
  S.tech=D.tech;
  const c0=CHG_MS(), m0=CHG_MAX(), u0=upCost();
  S.tech={spd:100,cap:100,cost:100};
  console.assert(CHG_MS()<c0&&CHG_MAX()>m0&&upCost()<u0,'테크 효과 미적용');
  console.assert(CHG_MS()>=1500,'충전 주기 하한 붕괴');
  console.assert(upCost()>=Math.round(50*Math.pow(1.55,S.lv))*0.49,'강화 비용 클램프 붕괴');
  console.assert(Object.values(TECH).every(v=>v.max===100),'테크 100단계 아님');
  console.assert(fmt(999)==='999'&&fmt(12345)==='12.3K'&&fmt(2.5e9)==='2.5B','fmt 오류');
  { const svc=S.star; S.star=9; const t9={g:15,lv:10,st:9};
    console.assert(isFinite(sellPrice(t9))&&sellPrice(t9)>0,'후반 판매가 오버플로');
    S.star=svc; }
  S.tech={};
  console.assert(TILES.length===8,'주사위 칸 수 오류');
  console.assert(TILES.every(t=>['dust','gold','tok','chg'].includes(t.k)),'알 수 없는 보상 칸');
  const pos0=S.pos; let seen=new Set();
  for(let i=0;i<200;i++){ S.pos=(S.pos+1+((Math.random()*6)|0))%TILES.length; seen.add(S.pos); }
  console.assert(seen.size===8,'주사위가 닿지 않는 칸이 있음');
  S.pos=pos0;
  console.assert(climb()>=0,'층 계산 오류');
  const pk=S.peak, lvB=S.lv; S.lv=ASC_LV(); S.peak=0;
  console.assert(!canAscend(),'웨이브 관문 없이 승천됨');
  S.peak=ASC_WAVE(); console.assert(canAscend(),'관문 충족인데 승천 불가');
  S.peak=pk; S.lv=lvB;
  // 릴은 3 + 별, 단 5에서 멈춘다 (DESIGN.md "릴 수 = 3 + 별 (최대 5)")
  console.assert(REELS()===Math.min(3+S.star,5),'릴 수 오류');
  console.assert(PITY()===20*REELS(),'천장 문턱 오류');
  console.assert(Object.keys(makeItem('head',15).ops).length===4,'15등급 4줄 아님');
  console.assert(!makeItem('head',8).sp,'8등급에 각인');
  console.assert(!!makeItem('head',10).sp,'10등급에 각인 없음');
  console.assert(S.asell.length===GMAX,'자동판매 체크 길이 불일치');
  // 적 무리 표시
  console.assert(foeCount>=5&&foeCount<=9,'적 개체 수 5~9 범위 이탈');
  { const wv=S.wave, ok=[];
    for(let w=1;w<=60;w++){ S.wave=w; newWave(); ok.push(foeCount); }
    console.assert(ok.every(n=>n>=5&&n<=9),'웨이브별 적 개체 수 범위 이탈');
    console.assert(new Set(ok).size===5,'적 개체 수가 5종으로 안 퍼짐');
    S.wave=wv; newWave(); }
  console.assert(foeEls.length===0||foeEls.length===foeCount,'적 블록 수 불일치');
  /* 048 §2① — 손은 공짜, 견습생은 충전 1. 효과로 본다(깃발이 아니라 S.charge 로).
     ⚠ `spin()` 은 420ms 짜리 `setTimeout` 을 걸고 `spinning` 을 세운다. 하네스에서는
       setTimeout 이 즉시 돌아 바로 풀리지만 브라우저에서는 안 풀리므로, 검사 뒤
       `spinning=false` 로 되돌리고 대기열도 원래대로 자른다 — 점검이 상태를 남기면
       위 「자체 점검이 상태를 오염시킴」이 운다. */
  { const c0=S.charge, sp0=spinning, lk=S.lockIdx, st0=globalThis.setTimeout;
    let cFree=0, cPaid=0;
    try{
      /* ⚠ `spin()` 은 **420ms 뒤에** 대기열에 장비를 넣는다. 그 콜백은 이 점검이
         상태를 되돌린 **뒤에** 돌아서, 브라우저에서 새 세이브에 장비 두 개가 공짜로
         꽂혔다(실측: 첫 탭 0.7초 뒤 대기열 3). 그래서 두 번 부르는 동안만
         `setTimeout` 을 빈 함수로 바꿔 낀다 — 033 이 `confirm` 에 쓴 바로 그 방식이고,
         재는 값(`S.charge`)은 **동기로** 바뀌므로 검사는 그대로 성립한다. */
      globalThis.setTimeout=function(){ return 0; };
      S.charge=10; spinning=false; S.lockIdx=-1;
      spin(true);  cFree=S.charge;            // 손 — 충전 불변
      spinning=false;
      spin();      cPaid=S.charge;            // 견습생 — 충전 −1
    } finally {
      globalThis.setTimeout=st0;
      spinning=sp0; S.charge=c0; S.lockIdx=lk;
      // `spin()` 이 칸에 붙인 `.spin` 은 콜백이 떼어 간다. 그 콜백을 막았으니 여기서 뗀다.
      try{ [...document.querySelectorAll('.reel')].forEach(e=>e.classList.remove('spin')); }catch(e){}
    }
    console.assert(cFree===10,'손 제련이 충전을 썼다 (048 §2①)');
    console.assert(cPaid===9,'견습생 제련이 충전을 안 썼다 (048 §2①)'); }
  const pierce=stats({weapon:{part:'weapon',g:10,lv:1,base:100,wt:'melee',sp:'pierce',ops:{ranged:10}}});
  console.assert(pierce.dps>105,'관통 각인 미적용');
  const sv2=S.lv; S.lv=30;
  console.assert(cap()===GMAX,'최대 강화에서 상한 미개방');
  console.assert(Math.abs(gradeProbs(0).reduce((a,x)=>a+x,0)-1)<1e-9,'개방 후 확률 합 오류');
  S.lv=sv2;
  // 등급색 캐시가 CSS 토큰과 일치하는가 (010 §4). 굳는 시점이 앞당겨져 토큰 적용
  // 전에 걸리면 15색이 전부 기본값으로 굳고 등급 판독이 조용히 죽는다.
  // **이 검사만은 기준선이 newState() 가 아니라 CSS 토큰 자체다** (지시서가 정한 예외).
  if(typeof getComputedStyle==='function'){
    const cs=getComputedStyle(document.documentElement);
    console.assert(!!gcCache && gcCache.length===GMAX+1 &&
      gcCache.slice(1).every((c,i)=>c.join(',')===hex2rgb(cs.getPropertyValue('--g'+(i+1))).join(',')),
      '등급색 캐시가 CSS 토큰과 불일치');
  }
  // 진입 시점으로 통째 복원. 이 아래에서는 S 를 건드리지 않는다.
  Object.assign(S,snap);
  // 재발 방지: 점검이 상태를 남기고 나가면 여기서 잡힌다 (tech 는 참조 비교).
  console.assert(S.peak===snap.peak&&S.tech===snap.tech&&S.pos===snap.pos,
    '자체 점검이 상태를 오염시킴');
  console.log('self-check ok · ★'+S.star+' · 릴',REELS()+'개 · 상한',cap()+'등급 · 승천 제련',ASC_LV());
})();
</script>
