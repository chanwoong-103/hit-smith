<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>proto-stage — 엔진 판정 시제품 (013b)</title>
<!--
  013b 엔진 판정 시제품. **라이브러리 0 · 순수 2D 캔버스.**
  forge.html 을 대체하지 않는다 — 판정 자료이고 병합 대상이 아니다.
  게임 로직은 한 줄도 옮겨오지 않았다(웨이브는 가짜 값으로 오른다).

  일부러 forge.html 과 **같은 구조**로 만들었다. 그래야 "Phaser 가 지금 하는 일이
  2D 캔버스로 어떻게 대체되는가"(판정 기준 4)가 말이 아니라 코드로 남는다:
    · 두 겹 캔버스 + DOM 오버레이 공존 (#stage z-1 / #fx z2 / 패널은 그 사이)
    · 정적인 것을 구워 두고 재사용        → RenderTexture 자리
    · 무대 밖을 자르기                    → setCrop 자리
    · 안 바뀌면 루프를 끈다               → loop.sleep() 자리
    · 픽셀 문자열 → 스프라이트            → generateTexture 자리
    · 불티·셰이크                         → particles / cameras.shake 자리
-->
<style>
:root{
  /* ART-DIRECTION 6색. 이 파일은 이 여섯 개 밖으로 나가지 않는다. */
  --iron:#23262B; --coal:#14100E; --hot:#E2622A;
  --white:#FFD9A0; --quench:#4A6B72; --brass:#B08D4F;
  --line:#3a4552; --text:#c5cedb; --dim:#7d8b9c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--coal); color:var(--text);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.5;
  max-width:480px; margin:0 auto; padding:0;
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
/* forge.html 과 같은 두 겹 구조. 배경은 본문 뒤, 불티는 본문 앞. */
#stage{position:fixed;inset:0;z-index:-1;pointer-events:none}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none}
#stage canvas,#fx canvas{display:block}
#hud{flex:none;padding:10px 10px 0}
#focus{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 10px}
#manage{flex:0 1 auto;min-height:104px;max-height:30vh;overflow-y:auto;padding:0 10px 14px}
.panel{
  position:relative;border:1px solid #4d5866;border-radius:5px;padding:10px;margin-bottom:8px;
  background:linear-gradient(180deg,#2a333d,#1a2128);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 4px rgba(0,0,0,.45);
}
/* 무대 칸과 **그 패널까지** 바탕을 비운다 — 뒤 겹 캔버스가 여기로 비친다.
   forge.html 의 #forge 가 background:none 인 이유가 이것이고, 여기서도 같은
   함정을 밟았다: #arena 만 비우고 감싼 .panel 을 불투명하게 두면 z-index:-1
   캔버스가 패널 바탕에 통째로 가려진다. 칠해지긴 하는데 안 보인다. */
#pStage{background:none}
#arena{border:1px solid #4d5866;border-radius:6px;background:none;
  height:200px;box-shadow:inset 0 0 24px rgba(0,0,0,.6)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dim{color:var(--dim);font-size:11px;letter-spacing:.08em}
.num{font-family:ui-monospace,Menlo,monospace}
button{font-family:inherit;font-size:14px;color:var(--text);padding:9px 12px;cursor:pointer;
  background:linear-gradient(180deg,#3a4450,#262e37);border:1px solid #4d5866;border-radius:3px}
button.primary{background:linear-gradient(180deg,#dcb367,#a8842f);color:#22190a;
  border-color:#7d5f22;font-weight:700}
#mob{display:flex;justify-content:center;gap:5px;min-height:18px;margin-top:6px}
.foe{width:13px;height:16px;border:1px solid;border-radius:2px}
.foe.m{background:#e05a4a;border-color:#e05a4a}
.foe.r{background:transparent;border-color:#5f93bd}
</style>
</head>
<body>
<div id="stage"></div><div id="fx"></div>

<div id="hud">
  <div class="panel">
    <div class="row">
      <div><span class="dim">웨이브</span> <b class="num" id="wv">1</b>
        <span class="dim num" id="bio"> · 1구간</span></div>
      <div class="dim num" id="perf">—</div>
    </div>
    <div id="mob"></div>
  </div>
</div>

<div id="focus">
  <div class="panel" id="pStage">
    <div class="dim" style="margin-bottom:8px">전투 무대 (횡스크롤 · 3층 패럴랙스)</div>
    <div id="arena"></div>
    <div class="row" style="margin-top:10px">
      <button id="adv" class="primary" style="flex:2">웨이브 클리어 — 나아간다</button>
      <button id="kill" style="flex:1">처치</button>
    </div>
  </div>
</div>

<div id="manage">
  <div class="panel">
    <div class="dim">판정 기준 4 — Phaser 가 하던 일의 대체 자리</div>
    <div class="num" id="note" style="font-size:11px;color:var(--dim);line-height:1.7"></div>
  </div>
</div>

<script>
/* ══ 손그림 데이터 ══
   배경 타일 12장 (층당 4 × 3층) + 몹 6장 (근접·원거리 2축 × 3단계).
   ART-DIRECTION 「전투 무대」 상한 그대로다. 문자는 색이 아니라 팔레트 인덱스:
   . 투명 / 1 외곽선 / 2 본체어둠 / 3 본체 / 4 하이라이트 */
const T_FAR=[
  '..........................................................................1..............................121............................12221..........................1222221.........1..............122222221.......121............12222222221.....12221......11112222222222222111222222111111222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222',
  '..................................................1..............................121............................12221..........................1222221........................122222221......................12222222221....................1222222222221.......11111111111222222222222222111111222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222',
  '.......................................................................................................................................11.............11..............1221...........1221............122221.........122221..........12222221.......12222221.....11112222222211111112222222111111222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222',
  '.........................................................................................................111111111......................12222222221....................1222222222221..................1222222222222221...............1222222222222222211........11111222222222222222222221111111222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222'];
const T_MID=[
  '.............................................1..............................131............................1.3.1................111111111111131111111111111111113333333333333313333333333333333333222222222222222222222222222233222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222',
  '.........................................................................11.......111...................1331.....13331..........111111113331111113333111111111113333333333333333333333333333333333222222222222222222222222222233222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222',
  '................................................................................................................................111111111111111111111111111111113333333333333333333333333333333332222222222222222222222222222223222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222',
  '................................................................................................................................11111111111........111111111111.33333333333........333333333333.32222222223........322222222223.22222222222........222222222222.22222222222........222222222222.22222222222........222222222222.'];
const T_NEAR=[
  '111111111111111111111111111111114444444444444444444444444444444433333333333333333333333333333333322222222222222222222222222222232222222222222222222222222222222222222222222222222222222222222222',
  '111111111111111111111111111111114444444444444444444444444444444433313333333133333331333333313333322222222222222222222222222222232222122222221222222212222222122222222222222222222222222222222222',
  '.1.....1........1......1........1111111111111111111111111111111144444444444444444444444444444444333333333333333333333333333333333222222222222222222222222222222322222222222222222222222222222222',
  '111111111111111111111111111111114444444444411114444444444444444433333333331..133333333333333333332222222221.1222222222222222223222222222221..122222222222222222222222222222..2222222222222222222'];
const M_MELEE=[
  '.....................................................................111111.........13333331.......1333333331......1333333331......1333333331......1333333331.......13333331.........111111.....................................................................',
  '.....................................111111.........13333331.......1333333331.....13333333331.....13333333331.....13333333331.....13333333331.....13333333331......133333331........1333331..........11111......................................................',
  '......................1111..........13333331.......1333333331.....133333333331....133344433331....133433334331....133433334331....133344433331....133333333331....133333333331.....1333333331.......13333331..........1111......................................'];
const M_RANGED=[
  '.....................................................................111111.........11....11.......11......11......1........1......1........1......11......11.......11....11.........111111.....................................................................',
  '.....................................111111.........11....11.......11......11.....11........11....1..........1....1..........1....1..........1....11........11.....11......11.......11....11.........111111.....................................................',
  '......................1111..........11....11.......1........1.....11........11....1...1441...1....1..14..41..1....1..14..41..1....1...1441...1....1..........1....11........11.....1........1.......11....11..........1111......................................'];

/* ══ 팔레트 — ART-DIRECTION 6색뿐 ══ */
const C={iron:[0x23,0x26,0x2B],coal:[0x14,0x10,0x0E],hot:[0xE2,0x62,0x2A],
         white:[0xFF,0xD9,0xA0],quench:[0x4A,0x6B,0x72],brass:[0xB0,0x8D,0x4F]};
const mul=(c,k)=>c.map(v=>Math.max(0,Math.min(255,Math.round(v*k))));
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>'rgb('+c[0]+','+c[1]+','+c[2]+')';
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';

/* ══ 바이옴 = 팔레트 스왑 (원칙 3) ══
   구간 목록을 손으로 나열하지 않는다. 웨이브에서 공식으로 뽑고, 지형은 한 장도
   더 그리지 않는다. 대장간에서 멀어질수록 놋쇠 → 담금질물 로 식는다. */
const band=w=>Math.floor((w-1)/10);
function pal(w,shift){
  const base=mix(C.brass,C.quench,Math.min(1,band(w)/6));
  const b=shift?mix(base,C.iron,shift):base;
  return [null,mul(b,.30),mul(b,.62),b,mix(b,C.white,.45)];
}

/* ══ 픽셀 문자열 → 오프스크린 캔버스 ══
   Phaser 의 RenderTexture / generateTexture 자리다. 기본 원점이 가운데인 함정도,
   크기를 바꾸면 그 뒤 draw 가 깨지는 함정도 없다 — 캔버스는 그냥 캔버스다. */
function bake(list,w,h,p,s){
  const cv=document.createElement('canvas');
  cv.width=w*s*list.length; cv.height=h*s;
  const cx=cv.getContext('2d'), im=cx.createImageData(cv.width,cv.height), d=im.data;
  list.forEach((px,t)=>{ const ox=t*w*s;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const n=px.charCodeAt(y*w+x)-48; if(!(n>=1&&n<=4)) continue;
      const col=p[n];
      for(let sy=0;sy<s;sy++){ let o=((y*s+sy)*cv.width+ox+x*s)*4;
        for(let sx=0;sx<s;sx++,o+=4){ d[o]=col[0]; d[o+1]=col[1]; d[o+2]=col[2]; d[o+3]=255; } }
    }});
  cx.putImageData(im,0,0); return cv;
}

/* ══ 상태 (가짜 — 게임 로직을 옮겨오지 않는다) ══ */
const S={wave:1, scroll:0, foes:[]};
const LAY=[{d:T_FAR,w:32,h:12,par:0.15,sh:.55,s:3},
           {d:T_MID,w:32,h:10,par:0.45,sh:.25,s:3},
           {d:T_NEAR,w:32,h:6, par:1.00,sh:0,  s:3}];
let strip=[], mobPx=[];

/* 구운 것을 다시 쓴다. 바이옴이 바뀔 때만 다시 굽는다 (011 의 "재굽기 0" 성질). */
function rebake(){
  strip=LAY.map(L=>bake(L.d,L.w,L.h,pal(S.wave,L.sh),L.s));
  mobPx=[0,1,2].map(t=>[bake([M_MELEE[t]],16,16,pal(S.wave,0),2),
                        bake([M_RANGED[t]],16,16,pal(S.wave,0),2)]);
  V.perf.bakes++; V.stage.biome=band(S.wave);
}

/* ══ 두 겹 캔버스 (forge.html 과 같은 구조) ══ */
function layer(id){
  const el=document.createElement('canvas');
  document.getElementById(id).appendChild(el);
  return {el, cx:el.getContext('2d')};
}
const bg=layer('stage'), fx=layer('fx');
function fit(){
  for(const L of [bg,fx]){ L.el.width=innerWidth; L.el.height=innerHeight;
    L.el.style.width=innerWidth+'px'; L.el.style.height=innerHeight+'px'; }
  V.canvas={w:innerWidth,h:innerHeight};
}

/* ══ 무대 그리기 ══ */
const arena=()=>{ const r=document.getElementById('arena').getBoundingClientRect();
  return {x:r.left,y:r.top,w:r.width,h:r.height}; };

function drawStrip(cx,img,r,off,y,par){
  const w=img.width, o=((-off*par)%w+w)%w;
  for(let x=r.x-o;x<r.x+r.w;x+=w) cx.drawImage(img,x,y);
}
function drawStage(){
  const cx=bg.cx, r=arena();
  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,bg.el.width,bg.el.height);
  cx.save();
  /* 캔버스는 DOM 처럼 overflow 로 안 잘린다. Phaser 의 setCrop 자리이고,
     2D 캔버스에서는 clip 세 줄이다. */
  cx.beginPath(); cx.rect(r.x,r.y,r.w,r.h); cx.clip();
  if(shakeUntil>now()){ const a=2.5;
    cx.translate((Math.random()*2-1)*a,(Math.random()*2-1)*a); }
  /* 하늘: 무쇠 → 숯. 두 색의 색기 차이를 세로로 갈라 둔다 (ART-DIRECTION). */
  const g=cx.createLinearGradient(0,r.y,0,r.y+r.h);
  g.addColorStop(0,rgb(C.iron)); g.addColorStop(1,rgb(C.coal));
  cx.fillStyle=g; cx.fillRect(r.x,r.y,r.w,r.h);
  /* 대장간 잔광 — **방사 그라디언트 한 줄**.
     008 은 Phaser Graphics 에 이게 없어 타원 26장을 겹쳤고, 그 오버드로가
     009~011 이 세 단계에 걸쳐 걷어낸 프레임 비용의 정체였다. */
  const gl=cx.createRadialGradient(r.x,r.y+r.h,0,r.x,r.y+r.h,r.w*.85);
  gl.addColorStop(0,rgba(C.hot,.34*Math.max(0,1-band(S.wave)/6)));
  gl.addColorStop(1,rgba(C.hot,0));
  cx.fillStyle=gl; cx.fillRect(r.x,r.y,r.w,r.h);
  /* 3층 패럴랙스 — 층마다 스크롤 속도가 다르다 */
  const base=r.y+r.h;
  drawStrip(cx,strip[0],r,S.scroll,base-strip[2].height-strip[1].height-strip[0].height*.55,LAY[0].par);
  drawStrip(cx,strip[1],r,S.scroll,base-strip[2].height-strip[1].height*.62,LAY[1].par);
  drawStrip(cx,strip[2],r,S.scroll,base-strip[2].height,LAY[2].par);
  drawMobs(cx,r);
  cx.restore();
  V.stage.scroll=Math.round(S.scroll);
}
/* 몹: 근접=채움 / 원거리=비움 (001). 웨이브가 오르면 팔레트와 크기만 달라진다. */
const mobX=f=>arena().x+f.x-(moving?S.scroll-moving.from:0);
function drawMobs(cx,r){
  const y=r.y+r.h-strip[2].height-30, k=1+band(S.wave)*.05;
  for(const f of S.foes){
    if(f.dead) continue;
    const img=mobPx[f.tier][f.ranged?1:0];
    cx.drawImage(img, Math.round(mobX(f)), Math.round(y),
      Math.round(img.width*k), Math.round(img.height*k));
  }
}

/* ══ 불티 — Phaser 파티클 자리. 상한은 008 예산 그대로 64. ══ */
const PMAX=64; let parts=[], lastT=0;
function burst(x,y,n){
  for(let i=0;i<n&&parts.length<PMAX;i++){
    const a=Math.PI*(1.15+Math.random()*.7), v=40+Math.random()*170;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:280+Math.random()*440,max:720});
  }
  shakeUntil=now()+150; wake(1400);
}
function stepFx(t){
  const dt=Math.min(50,t-lastT); lastT=t;
  for(const p of parts){ p.vy+=520*dt/1000; p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; p.life-=dt; }
  if(parts.length) parts=parts.filter(p=>p.life>0);
  V.alive.particles=parts.length;
}
function drawFx(){
  const cx=fx.cx; cx.clearRect(0,0,fx.el.width,fx.el.height);
  if(!parts.length) return;
  cx.globalCompositeOperation='lighter';
  for(const p of parts){ const k=p.life/p.max;
    cx.fillStyle=rgba(k>.6?C.white:C.hot,Math.max(0,k));
    cx.fillRect(p.x-2,p.y-2,4,4); }
  cx.globalCompositeOperation='source-over';
}

/* ══ 절전 — Phaser 의 loop.sleep()/wake() 자리 ══
   자는 것이 기본이고, 화면이 실제로 달라지는 사건에만 깬다. 루프를 끄면
   update 가 안 도니 **깨우는 자리를 빠뜨리면 화면이 멈춘 채 어긋난다** —
   그래서 사건을 추측이 아니라 목록으로 못박는다(아래 배선). */
const now=()=>performance.now();
const IDLE_MS=320;
let raf=0, wakeUntil=0, shakeUntil=0, moving=null;
function wake(ms){
  wakeUntil=Math.max(wakeUntil,now()+(ms||IDLE_MS));
  if(V.perf.sleeping){ V.perf.sleeping=false; V.perf.wakes++; }
  if(!raf) raf=requestAnimationFrame(frame);
}
function sleep(){
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  if(!V.perf.sleeping){ V.perf.sleeping=true; V.perf.sleeps++; }
}
const idle=t=>t>=wakeUntil && !moving && !parts.length && shakeUntil<=t;
function frame(t){
  raf=0; lastT=lastT||t;
  if(moving) stepMove(t);
  stepFx(t);
  drawStage(); drawFx();
  V.perf.frames++;
  if(idle(t)) sleep(); else raf=requestAnimationFrame(frame);
}

/* ══ 웨이브 전환 = 유일하게 움직이는 순간 ══
   전투 중에는 정지한 한 장면이다. 상시 스크롤은 절전을 통째로 무효로 만든다. */
const MOVE_MS=700, TRAVEL=360;
function stepMove(t){
  const k=Math.min(1,(t-moving.t0)/MOVE_MS), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  S.scroll=moving.from+TRAVEL*e;
  if(k>=1){ moving=null; S.wave+=10;
    if(band(S.wave)!==V.stage.biome) rebake();
    newFoes(); paint(); }
}
function advance(){
  if(moving) return;
  moving={t0:now(),from:S.scroll}; wake(MOVE_MS+260); V.stage.moves++;
}

/* ══ 가짜 적 무리 (표시용) ══ */
function newFoes(){
  const n=5+(S.wave*7)%5, tier=Math.min(2,band(S.wave)>>1);
  S.foes=Array.from({length:n},(_,i)=>({x:40+i*46,tier,ranged:i%2===1,dead:false}));
  V.stage.foes=n;
}
function killOne(){
  const live=S.foes.filter(f=>!f.dead); if(!live.length){ newFoes(); paint(); return; }
  const f=live[0]; f.dead=true;
  const r=arena(); burst(mobX(f)+16, r.y+r.h-strip[2].height-16, 18);
  paint();
}

/* ══ DOM 오버레이 갱신 (캔버스와 공존한다) ══ */
function paint(){
  document.getElementById('wv').textContent=S.wave;
  document.getElementById('bio').textContent=' · '+(band(S.wave)+1)+'구간';
  document.getElementById('mob').innerHTML=S.foes.map(f=>
    '<i class="foe '+(f.ranged?'r':'m')+'"'+(f.dead?' style="opacity:.15"':'')+'></i>').join('');
}

/* ══ 검증 창구 (forge 의 __view 와 같은 역할) ══ */
const V={engine:'canvas2d', ready:false, canvas:{w:0,h:0},
  stage:{layers:3, tiles:12, mobs:6, tileSize:'32×12/32×10/32×6', biome:0, scroll:0, foes:0, moves:0},
  alive:{particles:0}, limits:{particles:PMAX},
  perf:{sleeping:false, wakes:0, sleeps:0, bakes:0, frames:0}};
globalThis.__view=V;
globalThis.__stageAdvance=advance;
globalThis.__stageKill=killOne;
globalThis.__stageWake=wake;
globalThis.__stageSleep=sleep;

/* ══ 배선 — 깨우는 자리 전부 ══
   전부 수동적이라(브라우저가 부른다) 루프가 자는 동안에도 살아 있다. */
fit(); rebake(); newFoes(); paint(); V.ready=true; wake(600);
addEventListener('resize',()=>{ fit(); wake(600); });
if(typeof ResizeObserver!=='undefined')
  new ResizeObserver(()=>wake()).observe(document.getElementById('arena'));
for(const id of ['focus','manage'])
  document.getElementById(id).addEventListener('scroll',()=>wake(),{passive:true});
for(const t of ['pointerdown','keydown','wheel','touchstart'])
  addEventListener(t,()=>wake(),{passive:true});
document.getElementById('adv').onclick=advance;
document.getElementById('kill').onclick=killOne;
setInterval(()=>{ const p=V.perf;
  document.getElementById('perf').textContent=
    (p.sleeping?'수면':'가동')+' · 프레임 '+p.frames+' · 깸 '+p.wakes; },250);
document.getElementById('note').innerHTML=
  ['RenderTexture → 오프스크린 canvas + drawImage (bake)',
   'setCrop → ctx.clip()',
   'loop.sleep/wake → cancelAnimationFrame + 사건 목록',
   'particles → 배열 + globalCompositeOperation=lighter',
   'cameras.shake → ctx.translate',
   '방사 그라디언트 → createRadialGradient (Graphics 에는 없다)'].join('<br>');
</script>
</body>
</html>
